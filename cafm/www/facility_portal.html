{% extends "templates/web.html" %}
{% block title %}Facility Request Portal{% endblock %}
{% block page_content %}
<div id="cafm-portal"><div class="portal-loading">Loading your requests...</div></div>
<script>
frappe.ready(function () {
  const root=document.getElementById("cafm-portal");
  const state={view:"all",priority:"All",location:"All",form:false,selected:null,editing:null};
  const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const initials=(frappe.session.user_fullname||"E").split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  const select=(items,value,label)=>'<label>'+label+'<select data-filter="'+label.toLowerCase().replace(" ","_")+'"><option value="All">All '+label.toLowerCase()+'s</option>'+items.map(x=>'<option '+(x===value?"selected":"")+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")+'</select></label>';
  function render(data){
    const requests=data.requests||[], locations=data.locations||[], priorities=data.priorities||[];
    const shown=requests.filter(x=>{const status=String(x.custom_issue_status||"New").toLowerCase();return state.view==="all"?!["resolved","closed"].includes(status):status.replace(" ","_")===state.view;}).filter(x=>state.priority==="All"||x.priority===state.priority).filter(x=>state.location==="All"||x.custom_facility_location===state.location);
    root.innerHTML='<div class="portal-shell"><aside class="portal-side"><div class="portal-profile"><span>'+initials+'</span><div><p>FACILITY PORTAL</p><h2>Hello, '+esc(frappe.session.user_fullname||"Employee")+'</h2></div></div><nav><button data-view="all" class="'+(state.view==="all"?"active":"")+'">My requests </button><button data-view="new" class="'+(state.view==="new"?"active":"")+'">New </button><button data-view="in_progress" class="'+(state.view==="in_progress"?"active":"")+'">In Progress</button><button data-view="resolved" class="'+(state.view==="resolved"?"active":"")+'">Resolved</button></nav><button class="portal-new">+ New request</button><p class="portal-note">You can view only requests submitted by your account.</p></aside><main class="portal-main"><header><div><p>'+(state.form?"NEW FACILITY REQUEST":"MY REQUESTS")+'</p><h1>'+(state.form?"Tell us what you need":"Track your facility requests")+'</h1></div><button class="btn btn-primary portal-refresh"><span class="portal-refresh-icon">&#8635;</span><span class="portal-refresh-label">Refresh</span></button></header>'+(state.form?form(data):list(shown,locations,priorities))+'</main></div>';
    bind(data);
  }
  function list(requests,locations,priorities){
    const cards=requests.length?requests.map(x=>'<article class="portal-card" data-request="'+esc(x.name)+'"><div class="portal-card-body"><span class="portal-status">'+esc(x.custom_issue_status||"New")+'</span><em>'+esc(x.priority)+'</em><h3>'+esc(x.subject)+'</h3><small>'+esc(x.custom_facility_location)+' - '+esc(x.issue_type)+'</small></div><button class="portal-open" type="button">View request</button></article>').join(""):'<div class="portal-empty"><h3>No matching requests</h3><p>Use New request to let the facility team know what you need.</p></div>';
    return '<section class="portal-filters">'+select(priorities,state.priority,"Priority")+select(locations,state.location,"Location")+'</section><div class="portal-heading">'+requests.length+' requests found</div><div class="portal-list">'+cards+'</div>'+(state.selected?details(state.selected):"");
  }
  function details(x){
    const canChange=x.custom_issue_status==="New"&&!x.custom_work_order;
    return '<div class="portal-modal-backdrop"><section class="portal-modal"><button class="portal-modal-close" type="button">x</button><p class="portal-modal-label">REQUEST '+esc(x.name)+'</p><h2>'+esc(x.subject)+'</h2><div class="portal-detail-grid"><div><span>Status</span><strong>'+esc(x.custom_issue_status||"New")+'</strong></div><div><span>Priority</span><strong>'+esc(x.priority)+'</strong></div><div><span>Location</span><strong>'+esc(x.custom_facility_location)+'</strong></div><div><span>Category</span><strong>'+esc(x.issue_type)+'</strong></div></div><div class="portal-description"><span>Description</span><p>'+esc(x.description).replace(/\n/g,"<br>")+'</p></div>'+(canChange?'<div class="portal-actions"><button class="btn btn-default portal-edit" type="button">Edit request</button><button class="btn btn-danger portal-withdraw" type="button">Withdraw request</button></div>':'<p class="portal-readonly">This request is already being handled by the maintenance team and can no longer be changed here.</p>')+'</section></div>';
  }
  function form(data){
    const x=state.editing||{}, edit=!!state.editing;
    const chosen=(value,current)=>value===current?" selected":"";
    return '<section class="portal-form"><button class="portal-back">Back to requests</button><form id="portal-request-form"><label>Subject<input name="subject" required value="'+esc(x.subject||"")+'" placeholder="Briefly describe the issue"></label><label>Facility location<select name="facility_location" required><option value="">Select location</option>'+data.locations.map(v=>'<option'+chosen(v,x.custom_facility_location)+' value="'+esc(v)+'">'+esc(v)+'</option>').join("")+'</select></label><label>Category<select name="issue_type" required><option value="">Select category</option>'+data.categories.map(v=>'<option'+chosen(v,x.issue_type)+' value="'+esc(v)+'">'+esc(v)+'</option>').join("")+'</select></label><label>Priority<select name="priority" required><option value="">Select priority</option>'+data.priorities.map(v=>'<option'+chosen(v,x.priority)+' value="'+esc(v)+'">'+esc(v)+'</option>').join("")+'</select></label><label>Description<textarea name="description" required placeholder="Add useful details, such as when the issue started or what you observed.">'+esc(x.description||"")+'</textarea></label><button class="btn btn-primary" type="submit">'+(edit?"Save changes":"Submit request")+'</button></form></section>';
  }
  function bind(data){
    root.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.form=false;state.selected=null;state.editing=null;load();});
    root.querySelector(".portal-new").onclick=()=>{state.form=true;state.editing=null;state.selected=null;render(data);};
    root.querySelector(".portal-refresh").onclick=load;
    root.querySelectorAll("[data-filter]").forEach(s=>s.onchange=()=>{state[s.dataset.filter]=s.value;load();});
    root.querySelectorAll("[data-request]").forEach(card=>card.onclick=()=>{state.selected=data.requests.find(x=>x.name===card.dataset.request)||null;render(data);});
    const close=root.querySelector(".portal-modal-close"); if(close) close.onclick=()=>{state.selected=null;render(data);};
    const edit=root.querySelector(".portal-edit"); if(edit) edit.onclick=()=>{state.editing=state.selected;state.selected=null;state.form=true;render(data);};
    const withdraw=root.querySelector(".portal-withdraw"); if(withdraw) withdraw.onclick=()=>{frappe.confirm("Withdraw this request? The maintenance team will no longer receive it.",()=>frappe.call({method:"cafm.portal.withdraw_portal_request",args:{name:state.selected.name},freeze:true,callback:()=>{frappe.show_alert({message:"Request withdrawn",indicator:"green"});state.selected=null;load();}}));};
    const back=root.querySelector(".portal-back"); if(back) back.onclick=()=>{state.form=false;state.editing=null;render(data);};
    const formEl=root.querySelector("#portal-request-form"); if(formEl) formEl.onsubmit=e=>{e.preventDefault();const args=Object.fromEntries(new FormData(formEl).entries());const edit=state.editing;if(edit) args.name=edit.name;frappe.call({method:edit?"cafm.portal.update_portal_request":"cafm.portal.submit_portal_request",args,freeze:true,callback:r=>{frappe.show_alert({message:edit?"Request updated":"Request "+r.message.name+" submitted",indicator:"green"});state.form=false;state.editing=null;state.view="all";load();}});};
  }
  function load(){frappe.call({method:"cafm.portal.get_portal_requests",callback:r=>render(r.message||{})});}
  load();
});
</script>
<style>
#cafm-portal{max-width:1180px;margin:32px auto;padding:0 18px}.portal-shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:650px;border:1px solid #dbe5ee;border-radius:18px;overflow:hidden;background:#f5f8fb}.portal-side{padding:20px 14px;background:#103f6b;color:#fff}.portal-profile{display:flex;gap:11px;align-items:center;padding:4px 6px 24px}.portal-profile>span{display:grid;place-items:center;width:39px;height:39px;border-radius:50%;background:#42a5dd;font-weight:700}.portal-profile p{margin:0 0 3px;color:#a9d5f0;font-size:10px;font-weight:800;letter-spacing:.3px}.portal-profile h2{margin:0;font-size:16px}.portal-side nav{display:grid;gap:7px}.portal-side nav button{display:flex;justify-content:space-between;padding:11px 10px;border:0;border-radius:10px;background:transparent;color:#edf7ff;text-align:left}.portal-side nav button.active,.portal-side nav button:hover{background:#1d5d92}.portal-side nav b{font-size:11px}.portal-new{width:100%;margin-top:22px;padding:10px;border:1px solid #53a7d7;border-radius:9px;background:#fff;color:#174f80;font-weight:700}.portal-note{margin:25px 7px;color:#a9d5f0;font-size:11px;line-height:1.5}.portal-main{padding:26px;min-width:0}.portal-main header{display:flex;align-items:center;gap:14px;margin-bottom:22px}.portal-main header div{flex:1}.portal-main header p{margin:0;color:#476f92;font-size:12px;font-weight:700}.portal-main h1{margin:3px 0;color:#19324b;font-size:27px}.portal-filters{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;padding:15px;border:1px solid #dce7ef;border-radius:13px;background:#fff}.portal-filters label,.portal-form label{display:grid;gap:5px;color:#3f627f;font-size:12px;font-weight:700}.portal-filters select,.portal-form input,.portal-form select,.portal-form textarea{min-height:41px;padding:0 10px;border:1px solid #d0dfe9;border-radius:8px;background:#fff}.portal-heading{margin:20px 3px 10px;color:#4d6d8a;font-size:12px;font-weight:600}.portal-list{display:grid;gap:10px}.portal-list article{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:15px;border:1px solid #dce6ee;border-radius:13px;background:#fff}.portal-list b,.portal-list small{display:block}.portal-list small{margin-top:7px;color:#567087}.portal-status{padding:4px 8px;border-radius:12px;background:#e6f1fb;color:#1d649b;font-size:11px;font-weight:700}.portal-list em{grid-column:2;font-style:normal;color:#b25d00;font-size:12px}.portal-empty{padding:30px;text-align:center;border:1px solid #dce6ee;border-radius:13px;background:#fff;color:#587187}.portal-empty h3{margin-top:0;color:#263442}.portal-form{max-width:700px;padding:22px;border:1px solid #dce7ef;border-radius:13px;background:#fff}.portal-back{margin-bottom:18px;border:0;background:transparent;color:#276b9f}.portal-form form{display:grid;gap:14px}.portal-form textarea{min-height:120px;padding:10px}@media(max-width:760px){.portal-shell{grid-template-columns:1fr}.portal-side{min-height:auto}.portal-main{padding:18px}.portal-filters{grid-template-columns:1fr}}
.portal-profile h2{color:#ffffff!important}.portal-main .btn-primary,.portal-form .btn-primary{background:#0f5a97!important;border-color:#0f5a97!important;color:#ffffff!important}.portal-main .btn-primary:hover,.portal-form .btn-primary:hover{background:#174f80!important;border-color:#174f80!important}.portal-refresh{display:inline-flex;align-items:center;gap:7px}.portal-refresh-icon{font-size:17px;line-height:1}@media(max-width:900px){.portal-refresh{width:41px;min-width:41px;padding-left:0!important;padding-right:0!important;justify-content:center}.portal-refresh-label{display:none}}.portal-filters{grid-template-columns:160px minmax(0,1fr)!important}.portal-filters label{min-width:0}.portal-filters select{width:100%;min-width:0;box-sizing:border-box}.portal-side nav button b{display:inline-flex;align-items:center;justify-content:center;min-width:18px;min-height:18px;line-height:18px}.portal-card{cursor:pointer}.portal-card:hover{border-color:#7db4d8;box-shadow:0 5px 14px rgba(22,73,111,.08)}.portal-card-body{min-width:0}.portal-card h3{margin:8px 0 0;color:#19324b;font-size:16px}.portal-open{grid-column:2;border:0;background:transparent;color:#17629b;font-weight:700}.portal-modal-backdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(15,37,56,.48)}.portal-modal{position:relative;width:min(620px,100%);max-height:85vh;overflow:auto;padding:27px;border-radius:16px;background:#fff;box-shadow:0 16px 42px rgba(0,0,0,.22)}.portal-modal-close{position:absolute;top:14px;right:16px;border:0;background:transparent;color:#0d8b72;font-size:24px}.portal-modal-label{margin:0;color:#48708f;font-size:11px;font-weight:800;letter-spacing:.4px}.portal-modal h2{margin:7px 30px 22px 0;color:#19324b;font-size:22px}.portal-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.portal-detail-grid div,.portal-description{padding:12px;border-radius:9px;background:#f2f7fb}.portal-detail-grid span,.portal-description span{display:block;margin-bottom:4px;color:#55748f;font-size:11px;font-weight:700}.portal-detail-grid strong{color:#24394b}.portal-description{margin-top:12px}.portal-description p{margin:0;color:#304c63;line-height:1.5}.portal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.portal-actions .btn-danger{background:#c93838;border-color:#c93838;color:#fff}.portal-readonly{margin:20px 0 0;padding:11px;border-radius:8px;background:#f2f7fb;color:#4d6d8a;font-size:13px}</style>
{% endblock %}

.portal-profile h2{color:#ffffff!important}.portal-main .btn-primary,.portal-form .btn-primary{background:#0f5a97!important;border-color:#0f5a97!important;color:#ffffff!important}.portal-main .btn-primary:hover,.portal-form .btn-primary:hover{background:#174f80!important;border-color:#174f80!important}.portal-refresh{display:inline-flex;align-items:center;gap:7px}.portal-refresh-icon{font-size:17px;line-height:1}@media(max-width:900px){.portal-refresh{width:41px;min-width:41px;padding-left:0!important;padding-right:0!important;justify-content:center}.portal-refresh-label{display:none}}.portal-filters{grid-template-columns:160px minmax(0,1fr)!important}.portal-filters label{min-width:0}.portal-filters select{width:100%;min-width:0;box-sizing:border-box}.portal-side nav button b{display:inline-flex;align-items:center;justify-content:center;min-width:18px;min-height:18px;line-height:18px}</style>
