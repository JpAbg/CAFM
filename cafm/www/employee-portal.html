{% extends "templates/web.html" %}
{% block title %}Employee Portal{% endblock %}
{% block page_content %}
<div id="cafm-employee-portal"><div class="ep-loading">Loading your employee portal...</div></div>
<script>
frappe.ready(function () {
  const root = document.getElementById("cafm-employee-portal");
  const state = {view:"all", priority:"All", location:"All", data:{}, form:false, selected:null, editing:null, collapsed:localStorage.getItem("cafm-employee-portal-collapsed")==="1"};
  const esc = value => String(value || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const call = (method,args) => new Promise((resolve,reject)=>frappe.call({method,args:args||{},callback:r=>resolve(r.message||{}),error:reject}));
  const displayName = value => { const parts=String(value||"Employee").trim().split(/\s+/).filter(Boolean); return parts.length>1?parts[0]+" "+parts[parts.length-1]:parts[0]||"Employee"; };
  const initials = value => displayName(value).split(/\s+/).slice(0,2).map(part=>part[0].toUpperCase()).join("");
  const statusKey = value => String(value||"").toLowerCase().replace(/\s+/g,"_");
  function icon(name){const paths={brand:'<path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path d="m14.8 8.5-2.1 7h-2.3L8.8 11h2.1l.8 2.8.9-3.2a2.8 2.8 0 0 1 2.2-2.1Z"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',new:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/>',progress:'<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',resolved:'<path d="M20 11a8 8 0 1 1-4.7-7.3"/><path d="m9 11 3 3 8-8"/>',refresh:'<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',down:'<path d="m6 9 6 6 6-6"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/>'};return '<svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||paths.home)+'</svg>';}
  function nav(id,label,iconName){return '<button class="ep-nav '+(state.view===id&&!state.form?'active':'')+'" data-view="'+id+'" title="'+esc(label)+'"><span>'+icon(iconName)+'</span><em>'+esc(label)+'</em></button>';}
  function sidebar(){const name=displayName(frappe.session.user_fullname);return '<aside class="ep-sidebar"><div class="ep-brand"><span>'+icon("brand")+'</span><div><strong>CAFM</strong><small>EMPLOYEE PORTAL</small></div></div><div class="ep-account-wrap"><button class="ep-profile ep-account-button" type="button" aria-expanded="false"><span>'+esc(initials(name))+'</span><div><p>EMPLOYEE</p><h2>'+esc(name)+'</h2></div><b>'+icon("down")+'</b></button><div class="ep-account-menu" hidden><button class="ep-account-about">'+icon("about")+'<span>About</span></button><button class="ep-account-logout">'+icon("logout")+'<span>Log out</span></button></div></div><nav>'+nav("all","My requests","home")+nav("new","New","new")+nav("in_progress","In Progress","progress")+nav("resolved","Resolved","resolved")+'</nav><button class="ep-create">'+icon("plus")+'<em>Create request</em></button><p class="ep-note">Only requests submitted by your account are shown.</p><button class="ep-collapse"><span>'+icon(state.collapsed?"right":"left")+'</span><em>'+(state.collapsed?"Expand":"Collapse")+'</em></button></aside>';}
  function header(){return '<header class="ep-header"><div><p>'+(state.form?"FACILITY REQUEST":"MY REQUESTS")+'</p><h1>'+(state.form?(state.editing?"Update your request":"Tell the facility team what you need"):"Track your facility requests")+'</h1></div><button class="ep-refresh" title="Refresh">'+icon("refresh")+'<span>Refresh</span></button></header>';}
  function options(values,current,label,all){return (all?'<option value="All">All '+label+'</option>':'<option value="" disabled '+(!current?'selected':'')+'>Select '+label+'</option>')+(values||[]).map(v=>'<option value="'+esc(v)+'" '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join("");}
  function list(){const rows=(state.data.requests||[]).filter(row=>{const status=statusKey(row.custom_issue_status||"New");const match=state.view==="all"?!["resolved","closed"].includes(status):state.view==="resolved"?["resolved","closed"].includes(status):status===state.view;return match&&(state.priority==="All"||row.priority===state.priority)&&(state.location==="All"||row.custom_facility_location===state.location);});const cards=rows.length?rows.map(row=>'<button class="ep-card" data-request="'+esc(row.name)+'"><div><span class="ep-status">'+esc(row.custom_issue_status||"New")+'</span><i>'+esc(row.priority)+'</i><strong>'+esc(row.subject)+'</strong><small>'+esc(row.custom_facility_location)+' · '+esc(row.issue_type)+'</small></div><b>View ›</b></button>').join(""):'<div class="ep-empty"><h3>No matching requests</h3><p>Create a request when you need help from the facility team.</p></div>';return '<section class="ep-filters"><label>Priority<select data-filter="priority">'+options(state.data.priorities,state.priority,"priorities",true)+'</select></label><label>Location<select data-filter="location">'+options(state.data.locations,state.location,"locations",true)+'</select></label></section><div class="ep-count">'+rows.length+' requests found</div><div class="ep-list">'+cards+'</div>'+details();}
  function requestForm(){const row=state.editing||{};return '<section class="ep-form"><button class="ep-back">‹ Back to requests</button><form id="ep-request-form"><label>Subject<input name="subject" required value="'+esc(row.subject)+'" placeholder="Briefly describe the issue"></label><label>Facility location<select name="facility_location" required>'+options(state.data.locations,row.custom_facility_location,"location",false)+'</select></label><label>Category<select name="issue_type" required>'+options(state.data.categories,row.issue_type,"category",false)+'</select></label><label>Priority<select name="priority" required>'+options(state.data.priorities,row.priority,"priority",false)+'</select></label><label>Description<textarea name="description" required placeholder="Describe what happened and when it started.">'+esc(row.description)+'</textarea></label><button class="ep-primary" type="submit">'+(state.editing?"Save changes":"Submit request")+'</button></form></section>';}
  function details(){const row=state.selected;if(!row)return "";const canChange=row.custom_issue_status==="New"&&!row.custom_work_order;return '<div class="ep-backdrop"><section class="ep-modal"><button class="ep-modal-close">×</button><p>REQUEST '+esc(row.name)+'</p><h2>'+esc(row.subject)+'</h2><div class="ep-detail"><div><small>Status</small><strong>'+esc(row.custom_issue_status||"New")+'</strong></div><div><small>Priority</small><strong>'+esc(row.priority)+'</strong></div><div><small>Location</small><strong>'+esc(row.custom_facility_location)+'</strong></div><div><small>Category</small><strong>'+esc(row.issue_type)+'</strong></div></div><article><small>Description</small><p>'+esc(row.description).replace(/\n/g,"<br>")+'</p></article>'+(canChange?'<footer><button class="ep-secondary ep-edit">Edit request</button><button class="ep-danger ep-withdraw">Withdraw request</button></footer>':'<div class="ep-readonly">This request is already being handled and can no longer be changed here.</div>')+'</section></div>';}
  function render(){root.innerHTML='<div class="ep-shell '+(state.collapsed?'is-collapsed':'')+'">'+sidebar()+'<main class="ep-main">'+header()+(state.form?requestForm():list())+'</main></div>';bind();}
  function bind(){root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.form=false;state.selected=null;state.editing=null;render();});root.querySelector('.ep-create').onclick=()=>{state.form=true;state.editing=null;state.selected=null;render();};root.querySelector('.ep-refresh').onclick=load;root.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{state[s.dataset.filter]=s.value;render();});root.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>{state.selected=(state.data.requests||[]).find(r=>r.name===b.dataset.request);render();});const close=root.querySelector('.ep-modal-close');if(close)close.onclick=()=>{state.selected=null;render();};const back=root.querySelector('.ep-back');if(back)back.onclick=()=>{state.form=false;state.editing=null;render();};const edit=root.querySelector('.ep-edit');if(edit)edit.onclick=()=>{state.editing=state.selected;state.selected=null;state.form=true;render();};const withdraw=root.querySelector('.ep-withdraw');if(withdraw)withdraw.onclick=()=>frappe.confirm('Withdraw this request?',async()=>{await call('cafm.portal.withdraw_portal_request',{name:state.selected.name});state.selected=null;frappe.show_alert({message:'Request withdrawn',indicator:'green'});load();});const form=root.querySelector('#ep-request-form');if(form)form.onsubmit=async event=>{event.preventDefault();const args=Object.fromEntries(new FormData(form).entries());if(state.editing)args.name=state.editing.name;const result=await call(state.editing?'cafm.portal.update_portal_request':'cafm.portal.submit_portal_request',args);frappe.show_alert({message:state.editing?'Request updated':'Request '+result.name+' submitted',indicator:'green'});state.form=false;state.editing=null;state.view='all';load();};bindChrome();}
  function bindChrome(){const shell=root.querySelector('.ep-shell'),collapse=root.querySelector('.ep-collapse'),wrap=root.querySelector('.ep-account-wrap'),button=root.querySelector('.ep-account-button'),menu=root.querySelector('.ep-account-menu');let temporary=false;const setCollapsed=value=>{state.collapsed=value;shell.classList.toggle('is-collapsed',value);collapse.querySelector('span').innerHTML=icon(value?'right':'left');collapse.querySelector('em').textContent=value?'Expand':'Collapse';localStorage.setItem('cafm-employee-portal-collapsed',value?'1':'0');};const open=()=>{menu.hidden=false;menu.classList.add('is-opening');requestAnimationFrame(()=>requestAnimationFrame(()=>menu.classList.remove('is-opening')));};const close=()=>{if(menu.hidden)return;menu.hidden=true;button.setAttribute('aria-expanded','false');if(temporary){temporary=false;setCollapsed(true);}};button.onclick=()=>{if(shell.classList.contains('is-collapsed')){temporary=true;setCollapsed(false);open();button.setAttribute('aria-expanded','true');}else if(menu.hidden){open();button.setAttribute('aria-expanded','true');}else close();};root.onclick=e=>{if(!wrap.contains(e.target))close();};root.querySelector('.ep-account-about').onclick=()=>{close();frappe.msgprint({title:'Employee Portal',message:'Submit and track your personal facility requests.',indicator:'blue'});};root.querySelector('.ep-account-logout').onclick=()=>frappe.call({method:'logout',callback:r=>{if(!r.exc)window.location.assign('/login');}});collapse.onclick=()=>{temporary=false;close();setCollapsed(!shell.classList.contains('is-collapsed'));};}
  async function load(){state.data=await call('cafm.portal.get_portal_requests');const user=await call('frappe.client.get_value',{doctype:'User',filters:frappe.session.user,fieldname:['first_name','last_name']});if(user)frappe.session.user_fullname=[user.first_name,user.last_name].filter(Boolean).join(' ');render();}
  load().catch(()=>{root.innerHTML='<div class="ep-error"><h2>Could not load the Employee Portal</h2><p>Please confirm that this account is linked to an active employee.</p></div>';});
});
</script>
<style>
body:has(#page-employee-portal){margin:0!important;padding:0!important;background:#f4f8fb;overflow-x:hidden}body:has(#page-employee-portal) .navbar,body:has(#page-employee-portal) .web-footer,body:has(#page-employee-portal) .page-breadcrumbs,body:has(#page-employee-portal) .page-footer{display:none!important}body:has(#page-employee-portal) #page-employee-portal,body:has(#page-employee-portal) .page-container,body:has(#page-employee-portal) .page-content-wrapper,body:has(#page-employee-portal) .page_content,body:has(#page-employee-portal) main.container{width:100%!important;max-width:none!important;min-height:100vh;margin:0!important;padding:0!important}#cafm-employee-portal{min-height:100vh;background:#f4f8fb;color:#19324b;font-family:Inter,var(--font-stack),-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#cafm-employee-portal *{box-sizing:border-box}.ep-icon{display:block;width:19px;height:19px}.ep-shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}.ep-sidebar{position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;width:270px;height:100vh;overflow:hidden;padding:18px 14px 14px;background:linear-gradient(165deg,#103e6a,#0b3156);color:#fff;transition:width .2s ease,padding .2s ease}.ep-brand{display:flex;align-items:center;gap:10px;margin:0 7px 20px}.ep-brand>span{display:grid;place-items:center;width:35px;height:35px;flex:0 0 35px;border-radius:10px;background:#49aee2}.ep-brand>span .ep-icon{width:22px;height:22px}.ep-brand strong,.ep-brand small{display:block}.ep-brand strong{font-size:17px;letter-spacing:.8px}.ep-brand small{margin-top:3px;color:#a9d5f0;font-size:8px;font-weight:800;letter-spacing:1.15px}.ep-account-wrap{position:relative;margin:0 7px 15px}.ep-profile{display:flex;align-items:center;gap:10px;width:100%;min-height:53px;padding:9px 10px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;text-align:left;cursor:pointer}.ep-profile>span{display:grid;place-items:center;width:35px;height:35px;flex:0 0 35px;border-radius:50%;background:#40a4dc;font-size:12px;font-weight:800}.ep-profile p,.ep-profile h2{margin:0}.ep-profile p{color:#a9d5f0;font-size:9px;font-weight:800}.ep-profile h2{overflow:hidden;max-width:160px;margin-top:3px;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.ep-profile>b{display:flex;margin-left:auto;color:#b3d9ef}.ep-profile>b .ep-icon{width:16px;height:16px}.ep-account-menu{position:absolute;top:calc(100% + 7px);z-index:60;display:grid;width:100%;padding:7px;border:1px solid rgba(181,217,239,.22);border-radius:12px;background:#173d5b;box-shadow:0 13px 28px rgba(0,0,0,.27);transition:opacity .16s ease,transform .16s ease}.ep-account-menu[hidden]{display:grid;opacity:0;transform:translateY(-6px);visibility:hidden;pointer-events:none}.ep-account-menu.is-opening{opacity:0;transform:translateY(-8px)}.ep-account-menu button{display:flex;align-items:center;gap:9px;padding:8px 9px;border:0;border-radius:7px;background:transparent;color:#eff8ff;font-size:12px}.ep-account-menu button:hover{background:#245979}.ep-account-menu .ep-icon{width:16px;height:16px;color:#9ccae5}.ep-account-logout{color:#ffd0d3!important}.ep-sidebar nav{display:grid;gap:3px}.ep-nav{display:flex;align-items:center;min-height:36px;padding:8px 11px;border:0;border-radius:9px;background:transparent;color:#eaf6ff;text-align:left}.ep-nav:hover{background:rgba(41,111,161,.45)}.ep-nav.active{background:#1c6097}.ep-nav span{display:none}.ep-nav em{font-size:12px;font-style:normal;font-weight:700}.ep-create{display:flex;align-items:center;justify-content:center;gap:8px;min-height:39px;margin:10px 7px 0;border:1px solid #4b94bf;border-radius:9px;background:transparent;color:#fff;font-size:12px;font-weight:800}.ep-create:hover{background:#fff;color:#134a78}.ep-create em{font-style:normal}.ep-create .ep-icon{width:17px;height:17px}.ep-note{margin:13px 8px;color:#a9d5f0;font-size:9px;line-height:1.4}.ep-collapse{display:flex;align-items:center;gap:8px;min-height:36px;margin:auto 7px 0;padding:7px 10px;border:0
</style>

{% endblock %}
