{% extends "templates/web.html" %}
{% block title %}Client Portal{% endblock %}
{% block page_content %}
<div id="cafm-client-portal">
  <div class="cp-loading">Loading your client workspace...</div>
</div>
<script>
frappe.ready(function () {
  const root = document.getElementById("cafm-client-portal");
  if (!root) return;

  const state = {
    requestView: "all",
    priority: "All",
    location: "All",
    requestData: {},
    selectedRequest: null,
    requestForm: false,
    editingRequest: null,
    collapsed: localStorage.getItem("cafm-client-portal-collapsed") === "1",
    userName: "client",
  };

  const esc = value => String(value || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const call = (method, args) => new Promise((resolve, reject) => frappe.call({
    method, args: args || {},
    callback: response => resolve(response.message || {}),
    error: reject,
  }));
  const displayName = value => {
    const parts = String(value || "client").charAt(0).toUpperCase() + String(value || "client").slice(1);
    return parts;
  };
  const initials = value => displayName(value).split(/\s+/).slice(0, 2)
    .map(part => part.charAt(0).toUpperCase()).join("");
  const statusKey = value => String(value || "").toLowerCase().replace(/\s+/g, "_");

  function icon(name) {
    const paths = {
      brand: '<path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path d="m14.8 8.5-2.1 7h-2.3L8.8 11h2.1l.8 2.8.9-3.2a2.8 2.8 0 0 1 2.2-2.1Z"/>',
      progress: '<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',
      requests: '<path d="M4 4h16v13H7l-3 3Z"/><path d="M8 8h8m-8 4h5"/>',
      new: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/>',
      resolved: '<path d="M20 11a8 8 0 1 1-4.7-7.3"/><path d="m9 11 3 3 8-8"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      refresh: '<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',
      down: '<path d="m6 9 6 6 6-6"/>',
      about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
      logout: '<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/>',
      left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
      plus: '<path d="M12 5v14M5 12h14"/>'
    };
    return '<svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || paths.requests) + '</svg>';
  }

  function navButton(id, label, count, iconName) {
    const active = ("request-" + state.requestView) === id;
    return '<button class="cp-nav-item' + (active ? ' active' : '') + '" data-section="' + id + '" title="' + esc(label) + '"><span class="cp-nav-icon">' + icon(iconName) + '</span><em>' + esc(label) + '</em></button>';
  }

  function sidebar() {
    const requestRows = state.requestData.requests || [];
    const requestCount = key => requestRows.filter(row => {
      const status = statusKey(row.custom_issue_status || "New");
      return key === "all" ? !["resolved", "closed", "rejected"].includes(status) : key === "resolved" ? ["resolved", "closed"].includes(status) : status === key;
    }).length;
    return '<aside class="cp-sidebar">'
      + '<div class="cp-brand"><span>' + icon("brand") + '</span><div><strong>CAFM</strong><small>Client Portal</small></div></div>'
      + '<div class="cp-account-wrap"><button class="cp-profile cp-account-button" type="button" aria-expanded="false"><span>' + esc(initials(state.userName)) + '</span><div><p>FACILITY TEAM</p><h2>' + esc(displayName(state.userName)) + '</h2></div><b>' + icon("down") + '</b></button>'
      + '<div class="cp-account-menu" hidden><button class="cp-account-about" type="button">' + icon("about") + '<span>About</span></button><button class="cp-account-logout" type="button">' + icon("logout") + '<span>Log out</span></button></div></div>'
      + '<div class="cp-nav-group"><small>MY REQUESTS / WORK ORDERS</small>'
      + navButton("request-all", "All Requests", requestCount("all"), "requests")
      + navButton("request-new", "New", requestCount("new"), "new")
      + navButton("request-in_progress", "In Progress", requestCount("in_progress"), "progress")
      + navButton("request-resolved", "Resolved", requestCount("resolved"), "resolved")
      + '</div>'
      + '<p class="cp-note">Requests submitted by your account only.</p>'
      + '<button class="cp-collapse" type="button"><span class="cp-collapse-icon">' + icon(state.collapsed ? "right" : "left") + '</span><em>' + (state.collapsed ? "Expand" : "Collapse") + '</em></button>'
      + '</aside>';
  }

  function requestContent() {
    const requests = (state.requestData.requests || []).filter(row => {
      const status = statusKey(row.custom_issue_status || "New");
      return state.requestView === "all" ? !["resolved", "closed"].includes(status) : state.requestView === "resolved" ? ["resolved", "closed"].includes(status) : status === state.requestView;
    });
    const display = value => value === null || value === undefined || value === "" ? "-" : String(value);
    const rows = requests.map(row => {
      const searchable = [row.name, row.subject, row.custom_requester, row.assigned_to_email, row.custom_issue_status, row.status, row.priority, row.custom_facility_location, row.issue_type, row.custom_asset].map(display).join(" ").toLowerCase();
      return "<tr data-request-row=\"" + esc(searchable) + "\"><td><button class=\"cp-record-link\" type=\"button\" data-request=\"" + esc(row.name) + "\">" + esc(row.name) + "</button></td><td>" + esc(display(row.subject)) + "</td><td><span class=\"cp-table-badge status-" + esc(statusKey(row.custom_issue_status || "New")) + "\">" + esc(display(row.custom_issue_status || "New")) + "</span></td><td>" + esc(display(row.assigned_to_email)) + "</td><td><span class=\"cp-table-badge status-" + esc(statusKey(row.status || "Open")) + "\">" + esc(display(row.status || "Open")) + "</span></td><td><span class=\"cp-table-badge priority-" + esc(statusKey(row.priority)) + "\">" + esc(display(row.priority)) + "</span></td></tr>";
    }).join("");
    const table = rows ? "<div class=\"cp-request-table-wrap\"><table class=\"cp-request-table\"><thead><tr><th>ID</th><th>Subject</th><th>Issue Status</th><th>Assigned To (Email)</th><th>Status</th><th>Priority</th></tr></thead><tbody>" + rows + "</tbody></table></div>" : "<div class=\"cp-empty\"><h3>No matching requests</h3><p>Create a request when you need help from the facility team.</p></div>";
    return header("MY REQUESTS", "Track your facility requests", state.requestData.can_create !== false) + "<section class=\"cp-request-toolbar\"><input type=\"search\" data-request-search placeholder=\"Search by ID or displayed fields\"><strong>" + requests.length + " records</strong></section>" + table + (state.requestForm ? requestForm() : "") + requestModal();
  }

  function header(label, title, allowCreate) {
    return "<header class=\"cp-main-header\"><div><p>" + esc(label) + "</p><h1>" + esc(title) + "</h1></div><button class=\"cp-notifications\" type=\"button\" title=\"Notifications\">" + icon("bell") + "</button><button class=\"cp-refresh\" type=\"button\">" + icon("refresh") + "<span>Refresh</span></button>" + (allowCreate ? "<button class=\"cp-header-create\" type=\"button\" data-create-request>" + icon("plus") + "<span>Create Request</span></button>" : "") + "</header>";
  }

  function requestForm() {
    const data = state.requestData, row = state.editingRequest || {};
    const options = (values, current, label) => "<option value=\"\" disabled" + (!current ? " selected" : "") + ">Select " + label + "</option>" + (values || []).map(value => "<option value=\"" + esc(value) + "\"" + (current === value ? " selected" : "") + ">" + esc(value) + "</option>").join("");
    const title = state.editingRequest ? "Edit Issue" : "Create Issue";
    const submitLabel = state.editingRequest ? "Save changes" : "Create Issue";
    const requester = row.custom_requester || data.requester || "";
    const requesterField = data.is_admin
      ? "<label><span>Requester <b>*</b></span><select name=\"requester\" required>" + options(data.employees, requester, "requester") + "</select><small>Employee</small></label>"
      : "<label><span>Requester</span><input value=\"" + esc(requester) + "\" disabled><small>Your employee account</small></label>";
    return "<div class=\"cp-drawer-layer\" role=\"dialog\" aria-modal=\"true\"><button class=\"cp-drawer-backdrop\" type=\"button\" data-drawer-close aria-label=\"Close\"></button><section class=\"cp-record-drawer cp-create-drawer\"><header class=\"cp-drawer-header\"><div><p>CREATE RECORD</p><h2>" + esc(title) + "</h2><span>Complete the required information below.</span></div><button class=\"cp-drawer-close\" type=\"button\" data-drawer-close aria-label=\"Close\">&times;</button></header><form id=\"cp-request-form\" novalidate><section class=\"cp-drawer-section\"><h3>General</h3><div class=\"cp-drawer-form-grid\"><label><span>Subject <b>*</b></span><input name=\"subject\" required value=\"" + esc(row.subject) + "\"></label><label><span>Priority <b>*</b></span><select name=\"priority\" required>" + options(data.priorities, row.priority, "priority") + "</select><small>Issue Priority</small></label>" + requesterField + "<label><span>Asset</span><select name=\"asset\">" + options(data.assets, row.custom_asset, "asset") + "</select><small>Asset</small></label><label><span>Issue Type <b>*</b></span><select name=\"issue_type\" required>" + options(data.categories, row.issue_type, "issue type") + "</select><small>Issue Type</small></label><label><span>Facility Location <b>*</b></span><select name=\"facility_location\" required>" + options(data.locations, row.custom_facility_location, "facility location") + "</select><small>Facility Location</small></label></div></section><section class=\"cp-drawer-section\"><h3>Details</h3><label class=\"cp-drawer-description\"><span>Description <b>*</b></span><textarea name=\"description\" required rows=\"6\" placeholder=\"Describe what happened and when it started.\">" + esc(row.description) + "</textarea></label></section><div class=\"cp-drawer-error\" hidden></div><footer class=\"cp-drawer-footer\"><button class=\"cp-secondary\" type=\"button\" data-drawer-close>Cancel</button><button class=\"cp-primary\" type=\"submit\">" + esc(submitLabel) + "</button></footer></form></section></div>";
  }

  function requestModal() {
    const row = state.selectedRequest;
    if (!row) return "";
    const canChange = state.requestData.can_manage_requests !== false && row.custom_issue_status === "New" && !row.custom_work_order;
    const present = value => value !== null && value !== undefined && value !== "";
    const field = (label, value, badgeClass) => present(value) ? "<div class=\"cp-detail-card\"><small>" + esc(label) + "</small>" + (badgeClass ? "<span class=\"cp-table-badge " + badgeClass + "\">" + esc(value) + "</span>" : "<strong>" + esc(value) + "</strong>") + "</div>" : "";
    const section = (title, fields) => fields.some(Boolean) ? "<section class=\"cp-drawer-section\"><h3>" + esc(title) + "</h3><div class=\"cp-detail-grid-new\">" + fields.join("") + "</div></section>" : "";
    const actions = canChange ? "<div class=\"cp-drawer-actions\"><button type=\"button\" data-actions-toggle>Actions " + icon("down") + "</button><div data-actions-menu hidden><button class=\"cp-edit-request\" type=\"button\">Edit request</button><button class=\"cp-withdraw-request danger\" type=\"button\">Withdraw request</button></div></div>" : "";
    const general = section("General", [field("Series", row.naming_series), field("Subject", row.subject), field("Requester", row.custom_requester || state.userName), field("Raised by (Email)", row.raised_by), field("Assigned To (Email)", row.assigned_to_email), field("Issue Status", row.custom_issue_status || "New", "status-" + statusKey(row.custom_issue_status || "New")), field("Status", row.status || "Open", "status-" + statusKey(row.status || "Open")), field("Priority", row.priority, "priority-" + statusKey(row.priority)), field("Issue Type", row.issue_type), field("Facility Location", row.custom_facility_location), field("Asset", row.custom_asset), field("Work Order", row.custom_work_order)]);
    const details = present(row.description) ? "<section class=\"cp-drawer-section\"><h3>Details</h3><div class=\"cp-detail-card cp-detail-wide\"><small>Description</small><p>" + esc(row.description).replace(/\n/g, "<br>") + "</p></div></section>" : "";
    const sla = section("Service Level Agreement Details", [field("Service Level Agreement", row.service_level_agreement), field("Agreement Status", row.agreement_status)]);
    const response = section("Response Details", [field("First Responded On", row.first_responded_on), field("Pending Reason", row.custom_pending_reason), field("Rejection Reason", row.custom_rejection_reason)]);
    const resolution = section("Resolution Details", [field("Resolution Details", row.resolution_details), field("Opening Date", row.opening_date), field("Opening Time", row.opening_time)]);
    const reference = section("Reference", [field("Contact", row.contact), field("Company", row.company), field("Via Customer Portal", row.via_customer_portal ? "Yes" : "No")]);
    const openFull = state.requestData.can_open_full_record ? "<button class=\"cp-primary\" type=\"button\" data-open-full-record>Open Full Record</button>" : "";
    return "<div class=\"cp-drawer-layer\" role=\"dialog\" aria-modal=\"true\"><button class=\"cp-drawer-backdrop\" type=\"button\" data-preview-close aria-label=\"Close\"></button><section class=\"cp-record-drawer cp-view-drawer\"><header class=\"cp-drawer-header\"><div><p>Issue</p><h2>" + esc(row.subject) + "</h2><span>" + esc(row.name) + "</span></div><div class=\"cp-drawer-header-controls\">" + actions + "<button class=\"cp-drawer-close\" type=\"button\" data-preview-close aria-label=\"Close\">&times;</button></div></header>" + general + details + sla + response + resolution + reference + "<footer class=\"cp-drawer-footer cp-view-footer\"><button class=\"cp-secondary\" type=\"button\" data-preview-close>Close</button>" + openFull + "</footer></section></div>";
  }

  function render() {
    root.innerHTML = '<div class="cp-shell' + (state.collapsed ? ' is-collapsed' : '') + '">' + sidebar() + '<main class="cp-main">' + requestContent() + '</main></div>';
    bind();
  }

  function bind() {
    root.querySelectorAll("[data-section]").forEach(button => button.onclick = () => {
      state.requestView = button.dataset.section.replace(/^request-/, "");
      state.selectedRequest = null; state.requestForm = false;
      loadRequests();
    });
    const shell = root.querySelector(".cp-shell");
    const collapseButton = root.querySelector(".cp-collapse");
    const accountWrap = root.querySelector(".cp-account-wrap");
    const accountButton = root.querySelector(".cp-account-button");
    const accountMenu = root.querySelector(".cp-account-menu");
    let accountOpenedFromCollapsed = false;

    const setSidebarCollapsed = collapsed => {
      state.collapsed = collapsed;
      shell.classList.toggle("is-collapsed", collapsed);
      collapseButton.querySelector(".cp-collapse-icon").innerHTML = icon(collapsed ? "right" : "left");
      collapseButton.querySelector("em").textContent = collapsed ? "Expand" : "Collapse";
      collapseButton.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
      localStorage.setItem("cafm-client-portal-collapsed", collapsed ? "1" : "0");
    };
    const openAccountMenu = () => {
      accountMenu.hidden = false;
      accountMenu.classList.add("is-opening");
      requestAnimationFrame(() => requestAnimationFrame(() => accountMenu.classList.remove("is-opening")));
    };
    const closeAccountMenu = () => {
      if (accountMenu.hidden) return;
      accountMenu.hidden = true;
      accountButton.setAttribute("aria-expanded", "false");
      if (accountOpenedFromCollapsed) {
        accountOpenedFromCollapsed = false;
        setSidebarCollapsed(true);
      }
    };

    accountButton.onclick = () => {
      if (shell.classList.contains("is-collapsed")) {
        accountOpenedFromCollapsed = true;
        setSidebarCollapsed(false);
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
        return;
      }
      if (accountMenu.hidden) {
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
      } else closeAccountMenu();
    };
    root.onclick = event => { if (!accountWrap.contains(event.target)) closeAccountMenu(); };
    root.querySelector(".cp-account-about").onclick = () => {
      closeAccountMenu();
      frappe.msgprint({
        title: "client Portal",
        message: "Manage your assigned facility work and track requests submitted by your account.",
        indicator: "blue"
      });
    };
    root.querySelector(".cp-account-logout").onclick = () => frappe.call({
      method: "logout",
      callback: response => { if (!response.exc) window.location.assign("/login"); }
    });
    collapseButton.onclick = () => {
      accountOpenedFromCollapsed = false;
      closeAccountMenu();
      setSidebarCollapsed(!shell.classList.contains("is-collapsed"));
    };

    root.querySelectorAll(".cp-create-request, [data-create-request]").forEach(button => button.onclick = async () => { state.requestForm = true; state.editingRequest = null; await loadRequests(); });
    root.querySelector(".cp-refresh").onclick = loadRequests;
    root.querySelector(".cp-notifications").onclick = showNotifications;
    root.querySelectorAll("[data-request-filter]").forEach(control => control.onchange = () => { state[control.dataset.requestFilter] = control.value; render(); });
    const search = root.querySelector("[data-request-search]"); if (search) search.oninput = () => { const query = search.value.trim().toLowerCase(); root.querySelectorAll("[data-request-row]").forEach(row => row.hidden = Boolean(query) && !row.dataset.requestRow.includes(query)); };
    root.querySelectorAll("[data-request]").forEach(button => button.onclick = () => { state.selectedRequest = (state.requestData.requests || []).find(row => row.name === button.dataset.request); render(); });
    document.body.classList.toggle("cp-drawer-open", Boolean(state.requestForm || state.selectedRequest));
    root.querySelectorAll("[data-drawer-close]").forEach(button => button.onclick = () => { state.requestForm = false; state.editingRequest = null; render(); });
    root.querySelectorAll("[data-preview-close]").forEach(button => button.onclick = () => { state.selectedRequest = null; render(); });
    const openFullRecord = root.querySelector("[data-open-full-record]");
    if (openFullRecord) openFullRecord.onclick = () => { window.location.href = "/app/issue/" + encodeURIComponent(state.selectedRequest.name); };
    const actionsToggle = root.querySelector("[data-actions-toggle]");
    if (actionsToggle) actionsToggle.onclick = event => { event.stopPropagation(); const menu = root.querySelector("[data-actions-menu]"); menu.hidden = !menu.hidden; actionsToggle.setAttribute("aria-expanded", menu.hidden ? "false" : "true"); };
    const edit = root.querySelector(".cp-edit-request"); if (edit) edit.onclick = () => { state.editingRequest = state.selectedRequest; state.selectedRequest = null; state.requestForm = true; render(); };
    const withdraw = root.querySelector(".cp-withdraw-request"); if (withdraw) withdraw.onclick = withdrawRequest;
    const requestFormElement = root.querySelector("#cp-request-form"); if (requestFormElement) requestFormElement.onsubmit = submitRequest;

  }

  async function loadRequests() { state.requestData = await call("cafm.portal.get_portal_requests"); state.userName = state.requestData.user_full_name || state.userName; render(); }
  async function submitRequest(event) {
    event.preventDefault(); const form = event.currentTarget; const args = Object.fromEntries(new FormData(form).entries());
    const editing = state.editingRequest; if (editing) args.name = editing.name;
    const result = await call(editing ? "cafm.portal.update_portal_request" : "cafm.portal.submit_portal_request", args);
    frappe.show_alert({message: editing ? "Request updated" : "Request " + result.name + " submitted", indicator: "green"}); state.requestForm = false; state.editingRequest = null; state.requestView = "all"; await loadRequests();
  }
  function withdrawRequest() { frappe.confirm("Withdraw this request?", async () => { await call("cafm.portal.withdraw_portal_request", {name: state.selectedRequest.name}); state.selectedRequest = null; frappe.show_alert({message: "Request withdrawn", indicator: "green"}); await loadRequests(); }); }
  async function showNotifications() {
    const data = await call("cafm.mobile.get_my_mobile_notifications");
    const rows = (data.notifications || []).map(item => '<div class="cp-notification-row"><strong>' + esc(String(item.subject || "Notification").replace(/<[^>]*>/g, "")) + '</strong><small>' + esc(item.creation) + '</small></div>').join("") || '<p>No notifications yet.</p>';
    frappe.msgprint({title: "Notifications", message: rows});
    const unread = (data.notifications || []).filter(item => !item.read).map(item => item.name); if (unread.length) call("cafm.mobile.mark_mobile_notifications_read", {names: unread});
  }

  loadRequests().catch(() => { root.innerHTML = '<div class="cp-error"><h2>Could not load the client Portal</h2><p>Please confirm that this account is an active client.</p></div>'; });
});
</script>
<style>
body:has(#page-client-portal){margin:0!important;padding:0!important;background:#f4f8fb;overflow-x:hidden}
body:has(#page-client-portal) .navbar,body:has(#page-client-portal) .web-footer,body:has(#page-client-portal) .page-breadcrumbs,body:has(#page-client-portal) .page-footer{display:none!important}
body:has(#page-client-portal) #page-client-portal,body:has(#page-client-portal) .page-container,body:has(#page-client-portal) .page-content-wrapper,body:has(#page-client-portal) .page_content,body:has(#page-client-portal) main.container{width:100%!important;max-width:none!important;min-height:100vh;margin:0!important;padding:0!important}
#cafm-client-portal{min-height:100vh;background:#f4f8fb;color:#19324b}
#cafm-client-portal *{box-sizing:border-box}
.cp-shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.cp-sidebar{position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;width:270px;height:100vh;overflow-y:auto;padding:22px 14px;background:linear-gradient(165deg,#103e6a,#0b3156);color:#fff;transition:width .2s ease,padding .2s ease}
.cp-profile{display:flex;align-items:center;gap:11px;padding:4px 7px 22px}.cp-profile>span{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#42a5dd;color:#fff;font-size:13px;font-weight:800}.cp-profile p{margin:0 0 3px;color:#a9d5f0;font-size:9px;font-weight:800;letter-spacing:.5px}.cp-profile h2{margin:0;color:#fff;font-size:15px;white-space:nowrap}
