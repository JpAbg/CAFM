{% extends "templates/web.html" %}
{% block title %}CAFM Operations
{% endblock %}
{% block page_content %}
<div id="cafm-app-view">
  <div class="cafm-app-loading">Loading CAFM Operations...</div>
</div>
<script>
frappe.ready(function () {
  const root = document.getElementById("cafm-app-view");
  const esc = value => String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const route = value => window.location.href = value;

  function icon(name) {
    const paths = {
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
      maintenance: '<path d="m14 6 4-4 2 2-4 4M3 21l7-7 3 3-7 7H3Z"/><path d="m8 4 3 3-3 3-3-3Z"/>',
      assets: '<rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      vendors: '<path d="M4 20V7a2 2 0 0 1 2-2h8v15"/><path d="M14 10h4a2 2 0 0 1 2 2v8M8 9h2m-2 4h2m-2 4h2m7-3h1m-1 3h1"/>',
      utilities: '<path d="M13 2 5 13h6l-1 9 8-12h-6Z"/>',
      analytics: '<path d="M4 20V10m8 10V4m8 16v-7"/><path d="M2 20h20"/>',
      workspace: '<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/>',
      section: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>',
      left: '<path d="m15 18-6-6 6-6"/>',
      right: '<path d="m9 18 6-6-6-6"/>',
      open: '<path d="M14 3h7v7M10 14 21 3"/><path d="M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/>',
      print: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
      download: '<path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 21h14"/>',
      qr: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zm3 3h4v4h-4zm1-3h3"/>'
    };
    return '<svg class="cafm-app-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || '') + '</svg>';
  }


  function setDrawerScrollLock(locked) {
    document.documentElement.classList.toggle("cafm-drawer-open", locked);
    document.body.classList.toggle("cafm-drawer-open", locked);
  }

  function drawerSections(sections, renderFields) {
    const available = (sections || []).filter(section => (section.fields || []).length);
    if (!available.length) return '<div class="cafm-app-empty"><strong>No details available</strong></div>';
    const content = available.map(section => '<section class="cafm-native-section"><h3>' + esc(section.label) + '</h3>' + renderFields(section.fields || []) + '</section>').join("");
    return '<div class="cafm-native-section-scroll">' + content + '</div>';
  }

  window.cafmOpenRecordPreview = function(doctype, name) {
    const previous = root.querySelector(".cafm-record-preview");
    if (previous) previous.remove();
    const close = () => {
      const preview = root.querySelector(".cafm-record-preview");
      if (!preview || preview.classList.contains("is-closing")) return;
      preview.classList.add("is-closing");
      setTimeout(() => { preview.remove(); setDrawerScrollLock(false); }, 180);
    };
    const badgeClass = (value, fieldname) => {
      const text = String(value || "").toLowerCase();
      const field = String(fieldname || "").toLowerCase();
      if (/critical|breach|overdue|failed|cancelled|rejected/.test(text)) return "red";
      if (/high|pending|in progress/.test(text)) return "amber";
      if (/completed|closed|resolved|approved|active|met/.test(text)) return "green";
      if (/medium|assigned|new|draft|open/.test(text)) return "blue";
      if (/low|frequency/.test(text + field)) return "teal";
      if (/type/.test(field)) return "violet";
      return "gray";
    };
    const fieldValue = field => {
      const text = field.value === null || field.value === undefined || field.value === "" ? "-" : String(field.value);
      const isBadge = /(priority|status|type|frequency)/.test(String(field.fieldname || "").toLowerCase());
      return '<div class="cafm-record-preview-field"><small>' + esc(field.label) + '</small>' + (isBadge ? '<span class="cafm-subtle-badge ' + badgeClass(text, field.fieldname) + '"><span>' + esc(text) + '</span></span>' : '<strong>' + esc(text) + '</strong>') + '</div>';
    };
    setDrawerScrollLock(true);
    root.insertAdjacentHTML("beforeend", '<div class="cafm-record-preview" role="dialog" aria-modal="true"><button class="cafm-record-preview-backdrop" data-generic-preview-close aria-label="Close"></button><section class="cafm-record-preview-panel"><div class="cafm-record-preview-loading">Loading record...</div></section></div>');
    const preview = root.querySelector(".cafm-record-preview");
    preview.querySelector("[data-generic-preview-close]").onclick = close;
    frappe.call({
      method: "cafm.api.get_cafm_doctype_detail",
      args: { doctype, name },
      callback: response => {
        const item = response.message || {};
        const sections = item.sections && item.sections.length ? item.sections : [{ value: "details", label: "Details", fields: item.fields || [] }];
        const actions = item.actions || [];
        const actionOptions = actions.map(action => '<button type="button" data-record-action="' + esc(action.id) + '">' + icon(action.icon || "section") + '<span>' + esc(action.label) + '</span></button>').join("");
        const actionControl = actions.length ? '<div class="cafm-record-actions"><button type="button" class="cafm-record-actions-toggle" aria-expanded="false">Actions <b>⌄</b></button><div class="cafm-record-actions-menu" hidden>' + actionOptions + '</div></div>' : '';
        preview.querySelector(".cafm-record-preview-panel").innerHTML = '<header><div><p>' + esc(item.doctype || doctype) + '</p><h2>' + esc(item.title || item.name) + '</h2><span>' + esc(item.name) + '</span></div><div class="cafm-record-header-controls">' + actionControl + '<button type="button" data-generic-preview-close aria-label="Close">&times;</button></div></header>'
          + drawerSections(sections, fields => '<div class="cafm-record-preview-grid cafm-generic-preview-grid">' + fields.map(fieldValue).join("") + '</div>')
          + '<footer><button type="button" class="cafm-record-preview-secondary" data-generic-preview-close>Close</button><button type="button" class="cafm-record-preview-primary" data-generic-preview-open>Open full record</button></footer>';
        preview.querySelectorAll("[data-generic-preview-close]").forEach(button => button.onclick = close);
        preview.querySelector("[data-generic-preview-open]").onclick = () => window.location.href = item.route;
        function download(url, filename) { const link=document.createElement('a'); link.href=url; link.download=filename.replace(/[^a-z0-9_.-]/gi,'-'); document.body.appendChild(link); link.click(); link.remove(); }
        const showRecord = (recordDoctype, recordName) => { preview.remove(); setDrawerScrollLock(false); window.cafmOpenRecordPreview(recordDoctype, recordName); };
        const openListDialog = config => {
          preview.insertAdjacentHTML('beforeend','<div class="cafm-history-dialog"><button type="button" class="cafm-history-backdrop" data-list-close></button><section><header><div><p>'+esc(config.eyebrow)+'</p><h3>'+esc(item.title||item.name)+'</h3><span>'+esc(config.subtitle)+'</span></div><button type="button" data-list-close aria-label="Close">&times;</button></header><div class="cafm-history-content"><div class="cafm-record-preview-loading">Loading '+esc(config.loading||'records')+'...</div></div></section></div>');
          const dialog=preview.querySelector('.cafm-history-dialog');
          dialog.querySelectorAll('[data-list-close]').forEach(button=>button.onclick=()=>dialog.remove());
          const content=dialog.querySelector('.cafm-history-content');
          const cell=(column,value)=>{
            const text=value===null||value===undefined||value===''?'-':String(value);
            if(!/(priority|status|type|frequency)/.test(String(column.fieldname).toLowerCase())) return '<td>'+esc(text)+'</td>';
            return '<td><span class="cafm-subtle-badge '+badgeClass(text,column.fieldname)+'"><span>'+esc(text)+'</span></span></td>';
          };
          const renderRows = rows => {
            const columns = config.columns || (rows.length ? Object.keys(rows[0]).map(fieldname => ({fieldname, label: frappe.unscrub ? frappe.unscrub(fieldname) : fieldname})) : []);
            content.innerHTML = rows.length
              ? '<div class="cafm-history-table-wrap"><table><thead><tr>'+columns.map(column=>'<th>'+esc(column.label)+'</th>').join('')+'</tr></thead><tbody>'
                +rows.map(row=>'<tr>'+columns.map((column,index)=>index===0
                  ? '<td><button type="button" data-list-record="'+esc(row.name)+'">'+esc(row[column.fieldname]||row.name)+'</button></td>'
                  : cell(column,row[column.fieldname])).join('')+'</tr>').join('')
                +'</tbody></table></div>'
              : '<div class="cafm-app-empty"><strong>'+esc(config.emptyTitle)+'</strong><span>'+esc(config.emptyDetail)+'</span></div>';
            content.querySelectorAll('[data-list-record]').forEach(link=>link.onclick=()=>{dialog.remove();showRecord(config.doctype,link.dataset.listRecord);});
          };
          frappe.call({
            method: config.method || 'frappe.client.get_list',
            args: config.method ? (config.args||{}) : {
              doctype:config.doctype,
              filters:config.filters,
              fields:['name'].concat(config.columns.map(column=>column.fieldname).filter(fieldname=>fieldname!=='name')),
              order_by:config.order_by||'modified desc',
              limit_page_length:0
            },
            callback: response => renderRows(response.message||[]),
            error: error => { content.innerHTML='<div class="cafm-app-empty"><strong>Could not load records</strong><span>'+esc((error&&error.message)||'You may not have permission to view them.')+'</span></div>'; }
          });
        };
        const actionWrap = preview.querySelector('.cafm-record-actions');
        if (actionWrap) {
          const actionToggle = actionWrap.querySelector('.cafm-record-actions-toggle');
          const actionMenu = actionWrap.querySelector('.cafm-record-actions-menu');
          actionToggle.onclick = event => { event.stopPropagation(); actionMenu.hidden = !actionMenu.hidden; actionToggle.setAttribute('aria-expanded', actionMenu.hidden ? 'false' : 'true'); };
          actionWrap.querySelectorAll('[data-record-action]').forEach(button => button.onclick = () => {
            actionMenu.hidden = true; actionToggle.setAttribute('aria-expanded','false');
            const action = actions.find(entry => entry.id === button.dataset.recordAction) || {};
            if (action.id === 'print') window.open('/printview?doctype=' + encodeURIComponent(item.doctype) + '&name=' + encodeURIComponent(item.name) + '&format=Standard&trigger_print=1', '_blank');
            else if (action.id === 'download_pdf') window.open('/api/method/frappe.utils.print_format.download_pdf?doctype=' + encodeURIComponent(item.doctype) + '&name=' + encodeURIComponent(item.name) + '&format=Standard&no_letterhead=0', '_blank');
            else if (action.id === 'show_qr') {
              preview.insertAdjacentHTML('beforeend','<div class="cafm-qr-dialog"><button type="button" class="cafm-qr-backdrop" data-qr-close></button><section><button type="button" data-qr-close aria-label="Close">&times;</button><p>ASSET QR CODE</p><h3>' + esc(item.title || item.name) + '</h3><img src="' + esc(action.url) + '" alt="QR code for ' + esc(item.title || item.name) + '"><span>Scan this code to open the asset in CAFM.</span><button type="button" class="cafm-record-preview-primary" data-qr-download>Download QR Code</button></section></div>');
              const qr=preview.querySelector('.cafm-qr-dialog'); qr.querySelectorAll('[data-qr-close]').forEach(x=>x.onclick=()=>qr.remove()); qr.querySelector('[data-qr-download]').onclick=()=>download(action.url,item.name+'-cafm-qr.svg');
            } else if (action.id === 'download_qr') download(action.url,item.name+'-cafm-qr.svg');
            else if (action.id === 'create_maintenance_request') { preview.remove(); setDrawerScrollLock(false); window.cafmOpenCreateDrawer('Issue', action.defaults || {}); }
            else if (action.id === 'view_open_work_orders') openListDialog({
              eyebrow:'OPEN WORK ORDERS', subtitle:'Work orders still open for this asset', loading:'work orders',
              doctype:'Facility Work Order',
              filters:{ asset:item.name, work_order_status:['not in',['Closed','Cancelled']] },
              order_by:'planned_end asc',
              columns:[{fieldname:'name',label:'Work order'},{fieldname:'subject',label:'Subject'},{fieldname:'work_order_type',label:'Type'},{fieldname:'priority',label:'Priority'},{fieldname:'work_order_status',label:'Status'},{fieldname:'planned_end',label:'Due'}],
              emptyTitle:'No open work orders', emptyDetail:'New and in-progress work for this asset will appear here.'
            });
            else if (action.id === 'view_maintenance_history') {
              preview.insertAdjacentHTML('beforeend','<div class="cafm-history-dialog"><button type="button" class="cafm-history-backdrop" data-history-close></button><section><header><div><p>ASSET HISTORY</p><h3>' + esc(item.title || item.name) + '</h3><span>Completed maintenance work for this asset</span></div><button type="button" data-history-close aria-label="Close">&times;</button></header><div class="cafm-history-content"><div class="cafm-record-preview-loading">Loading maintenance history...</div></div></section></div>');
              const historyDialog=preview.querySelector('.cafm-history-dialog');
              const closeHistory=()=>historyDialog.remove();
              historyDialog.querySelectorAll('[data-history-close]').forEach(x=>x.onclick=closeHistory);
              frappe.call({method:'cafm.asset_maintenance.get_asset_maintenance_history',args:{asset_name:item.name},callback:r=>{
                const rows=r.message||[];
                const content=historyDialog.querySelector('.cafm-history-content');
                content.innerHTML=rows.length?'<div class="cafm-history-table-wrap"><table><thead><tr><th>Work order</th><th>Subject</th><th>Type</th><th>Category</th><th>Priority</th><th>Completed</th><th>Downtime</th><th>Labor</th><th>Material cost</th></tr></thead><tbody>'+rows.map(row=>'<tr><td><button type="button" data-history-work-order="'+esc(row.work_order)+'">'+esc(row.work_order)+'</button></td><td>'+esc(row.subject||'-')+'</td><td>'+esc(row.work_order_type||'-')+'</td><td>'+esc(row.category||'-')+'</td><td>'+esc(row.priority||'-')+'</td><td>'+esc(row.closed_on||row.actual_end||'-')+'</td><td>'+esc(row.downtime_hours??'-')+'</td><td>'+esc(row.labor_hours??'-')+'</td><td>'+esc(row.material_cost??'-')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="cafm-app-empty"><strong>No maintenance history</strong><span>Closed work orders for this asset will appear here.</span></div>';
                content.querySelectorAll('[data-history-work-order]').forEach(link=>link.onclick=()=>showRecord('Facility Work Order',link.dataset.historyWorkOrder));
              },error:()=>{historyDialog.querySelector('.cafm-history-content').innerHTML='<div class="cafm-app-empty"><strong>Could not load history</strong><span>You may not have permission to view these work orders.</span></div>';}});
            }
            else if (action.id === 'reopen_record') frappe.call({method:'cafm.api.reopen_cafm_record',type:'POST',args:{doctype:item.doctype,name:item.name},freeze:true,freeze_message:'Reopening record...',callback:r=>{if(r.message)showRecord(item.doctype,item.name);}});
            else if (action.id === 'create_work_order') frappe.call({ method:'cafm.cafm.doctype.facility_work_order.facility_work_order.create_from_issue', args:{issue_name:item.name}, freeze:true, freeze_message:'Creating Facility Work Order...', callback:r=>{ if(r.message)showRecord('Facility Work Order',r.message); } });
            else if (action.id === 'create_inspection') frappe.call({method:'cafm.cafm.doctype.facility_inspection.facility_inspection.create_from_work_order',args:{work_order_name:item.name},freeze:true,freeze_message:'Creating inspection...',callback:r=>{if(r.message)showRecord('Facility Inspection',r.message);}});
            else if (action.id === 'issue_materials') frappe.call({method:'cafm.materials.issue_materials',args:{work_order_name:item.name},freeze:true,freeze_message:'Issuing materials from stock...',callback:r=>{if(r.message)window.location.href='/app/stock-entry/'+encodeURIComponent(r.message);}});
            else if (action.id === 'request_vendor_quotation') { preview.remove(); setDrawerScrollLock(false); window.cafmOpenCreateDrawer('Facility Vendor Quotation',action.defaults||{}); }
            else if (action.id === 'view_vendor_quotations') openListDialog({
              eyebrow:'VENDOR QUOTATIONS', subtitle:'Quotations received for this work order', loading:'quotations',
              doctype:'Facility Vendor Quotation',
              filters:{ work_order:item.name },
              order_by:'creation desc',
              columns:[{fieldname:'name',label:'Quotation'},{fieldname:'service_provider',label:'Provider'},{fieldname:'total_amount',label:'Amount'},{fieldname:'quotation_status',label:'Status'},{fieldname:'valid_until',label:'Valid till'}],
              emptyTitle:'No vendor quotations', emptyDetail:'Requested quotations for this work order will appear here.'
            });
            else if (action.id === 'view_matching_contracts') openListDialog({
              eyebrow:'MATCHING CONTRACTS', subtitle:'Active service contracts that cover this work order', loading:'contracts',
              doctype:'Facility Service Contract',
              method:'cafm.cafm.doctype.facility_service_contract.facility_service_contract.get_matching_service_contracts',
              args:{ work_order_name:item.name },
              emptyTitle:'No matching contracts', emptyDetail:'No active service contract matches this work order.'
            });
            else if (action.id === 'generate_next_work_order') frappe.call({method:'cafm.cafm.doctype.preventive_maintenance_plan.preventive_maintenance_plan.generate_next_work_order',args:{plan_name:item.name},freeze:true,freeze_message:'Generating preventive work order...',callback:r=>{if(r.message)showRecord('Facility Work Order',r.message);}});
            else if (action.id === 'open_work_order') showRecord('Facility Work Order',action.work_order);
            else if (action.id === 'select_quotation') frappe.confirm('Select this quotation and reject the other open quotations for this work order?',()=>frappe.call({method:'cafm.cafm.doctype.facility_vendor_quotation.facility_vendor_quotation.select_vendor_quotation',args:{quotation_name:item.name},freeze:true,freeze_message:'Selecting vendor quotation...',callback:r=>{if(r.message)showRecord('Facility Work Order',r.message);}}));
          });
          preview.addEventListener('click', event => { if (!actionWrap.contains(event.target)) { actionMenu.hidden=true; actionToggle.setAttribute('aria-expanded','false'); } });
        }

      },
      error: () => {
        preview.querySelector(".cafm-record-preview-panel").innerHTML = '<div class="cafm-record-preview-error"><h2>Could not load record</h2><p>You may not have permission to view it.</p><button data-generic-preview-close>Close</button></div>';
        preview.querySelector("[data-generic-preview-close]").onclick = close;
      }
    });
  };

  window.cafmOpenCreateDrawer = function(doctype, initialValues = {}) {
    root.querySelector(".cafm-record-preview")?.remove();
    const close = (refresh) => {
      const drawer = root.querySelector(".cafm-record-preview");
      if (!drawer || drawer.classList.contains("is-closing")) return;
      drawer.classList.add("is-closing");
      setTimeout(() => {
        drawer.remove();
        setDrawerScrollLock(false);
        if (refresh) {
          const refreshButton = root.querySelector("[data-request-refresh],[data-generic-refresh],.cafm-app-header .cafm-app-refresh");
          if (refreshButton) refreshButton.click();
        }
      }, 180);
    };
    setDrawerScrollLock(true);
    root.insertAdjacentHTML("beforeend", '<div class="cafm-record-preview cafm-create-drawer" role="dialog" aria-modal="true"><button class="cafm-record-preview-backdrop" data-create-close aria-label="Close"></button><div class="cafm-create-alerts" role="status" aria-live="polite" aria-atomic="false"></div><section class="cafm-record-preview-panel"><div class="cafm-record-preview-loading">Loading creation form...</div></section></div>');
    const drawer = root.querySelector(".cafm-create-drawer");
    drawer.querySelector("[data-create-close]").onclick = () => close(false);
    const fieldAttributes = field => ' data-cafm-field="' + esc(field.fieldname) + '" data-depends-on="' + esc(field.depends_on || "") + '" data-mandatory-depends-on="' + esc(field.mandatory_depends_on || "") + '" data-read-only-depends-on="' + esc(field.read_only_depends_on || "") + '" data-native-required="' + (field.required ? "1" : "0") + '"';
    const inputFor = (field, index) => {
      const required = field.required ? " required" : "";
      const value = field.default === null || field.default === undefined ? "" : String(field.default);
      const description = field.description ? '<small class="cafm-create-description">' + esc(field.description) + '</small>' : "";
      const placeholder = field.placeholder || (field.fieldtype === "Link" ? "Search " + (field.link_doctype || field.label) : "");
      const label = '<label for="cafm-create-' + index + '">' + esc(field.label) + '<b data-required-mark' + (field.required ? '' : ' hidden') + '>*</b></label>';
      const attributes = fieldAttributes(field);
      if (field.fieldtype === "Table") {
        const headers = (field.child_fields || []).map(child => '<span>' + esc(child.label) + (child.required ? ' *' : '') + '</span>').join('');
        return '<div class="cafm-create-field cafm-create-field-wide cafm-create-child-table"' + attributes + '><div class="cafm-create-table-heading"><label>' + esc(field.label) + '</label><button type="button" data-add-child-row>+ Add row</button></div>' + description + '<div class="cafm-create-table-scroll"><div class="cafm-create-table-header" style="--child-columns:' + Math.max(1, (field.child_fields || []).length) + '">' + headers + '<span></span></div><div class="cafm-create-table-body" data-child-table-body></div></div></div>';
      }
      if (field.fieldtype === "Select") {
        const options = [""].concat(field.options || []);
        const optionButtons = (field.options || []).map(option => '<button type="button" role="option" data-cafm-select-value="' + esc(option) + '"' + (option === value ? ' aria-selected="true"' : '') + '>' + esc(option) + '</button>').join("");
        return '<div class="cafm-create-field cafm-create-select"' + attributes + '>' + label + '<select class="cafm-create-native-select" id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '" tabindex="-1" aria-hidden="true">' + options.map(option => '<option value="' + esc(option) + '"' + (option === '' ? ' disabled' : '') + (option === value ? ' selected' : '') + '>' + esc(option || "Select " + field.label) + '</option>').join("") + '</select><button class="cafm-create-dropdown-button" type="button" data-cafm-select-toggle aria-haspopup="listbox" aria-expanded="false"><span>' + esc(value || "Select " + field.label) + '</span><b>⌄</b></button><div class="cafm-create-dropdown-menu" role="listbox" hidden>' + optionButtons + '</div>' + description + '</div>';
      }
      if (field.fieldtype === "Link") {
        return '<div class="cafm-create-field cafm-create-link"' + attributes + '>' + label + '<div class="cafm-create-link-control"><input id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '" autocomplete="off"' + required + '><span>⌕</span><div class="cafm-create-link-menu" hidden></div></div><small>' + esc(field.link_doctype || "Linked record") + '</small>' + description + '</div>';
      }
      if (/Text|Code|JSON|Markdown|HTML Editor|Geolocation|Signature/.test(field.fieldtype)) {
        return '<div class="cafm-create-field cafm-create-field-wide"' + attributes + '>' + label + '<textarea id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '" rows="4" placeholder="' + esc(placeholder) + '"' + required + '>' + esc(value) + '</textarea>' + description + '</div>';
      }
      if (field.fieldtype === "Check") {
        return '<div class="cafm-create-field cafm-create-check"' + attributes + '><label><input id="cafm-create-' + index + '" type="checkbox" name="' + esc(field.fieldname) + '" value="1"' + (String(value) === "1" ? " checked" : "") + '><span>' + esc(field.label) + '</span></label>' + description + '</div>';
      }
      const type = field.fieldtype === "Date" ? "date" : field.fieldtype === "Datetime" ? "datetime-local" : field.fieldtype === "Time" ? "time" : field.fieldtype === "Color" ? "color" : field.fieldtype === "Password" ? "password" : field.fieldtype === "Phone" ? "tel" : ["Int","Float","Currency","Percent","Duration","Rating"].includes(field.fieldtype) ? "number" : "text";
      return '<div class="cafm-create-field"' + attributes + '>' + label + '<input id="cafm-create-' + index + '" type="' + type + '" name="' + esc(field.fieldname) + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '"' + required + '>' + description + '</div>';
    };
    const renderCreateFields = sectionFields => {
      const regularFields = sectionFields.filter(field => field.fieldtype !== "Table");

      const tableMarkup = tableFields.map(field => inputFor(field, field.fieldname.replace(/[^a-zA-Z0-9_-]/g, "-"))).join("");

    const bindCreateControls = (form, doctype, fields) => {

        if (field.fieldtype === 'Link') { const list=id+'-list'; return '<input id="' + esc(id) + '" data-child-field="' + esc(field.fieldname) + '" list="' + esc(list) + '" autocomplete="off"' + required + '><datalist id="' + esc(list) + '">' + (field.options || []).map(option => '<option value="' + esc(option) + '"></option>').join('') + '</datalist>'; }
        if (field.fieldtype === 'Check') return '<input id="' + esc(id) + '" type="checkbox" data-child-field="' + esc(field.fieldname) + '" value="1">';
        const type = field.fieldtype === 'Date' ? 'date' : field.fieldtype === 'Datetime' ? 'datetime-local' : field.fieldtype === 'Time' ? 'time' : ['Int','Float','Currency','Percent','Duration','Rating'].includes(field.fieldtype) ? 'number' : 'text';
        return '<input id="' + esc(id) + '" type="' + type + '" data-child-field="' + esc(field.fieldname) + '"' + required + '>';
      };
      form.querySelectorAll('.cafm-create-child-table').forEach(wrapper => {
        const field = fields.find(item => item.fieldname === wrapper.dataset.cafmField);
        const body = wrapper.querySelector('[data-child-table-body]');
        let rowIndex = 0;
        wrapper.querySelector('[data-add-child-row]').onclick = () => {
          const row = document.createElement('div');
          row.className = 'cafm-create-child-row';
          row.style.setProperty('--child-columns', Math.max(1, (field.child_fields || []).length));
          row.innerHTML = (field.child_fields || []).map(child => childControl(child, rowIndex)).join('') + '<button type="button" class="cafm-remove-child-row" title="Remove row">&times;</button>';
          row.querySelector('.cafm-remove-child-row').onclick = () => row.remove();
          body.appendChild(row); rowIndex += 1;
        };
      });
      const closeMenus = except => form.querySelectorAll('.cafm-create-dropdown-menu,.cafm-create-link-menu').forEach(menu => { if (menu !== except) menu.hidden = true; });
      form.querySelectorAll('[data-cafm-select-toggle]').forEach(toggle => {
        const wrapper = toggle.closest('.cafm-create-select');
        const select = wrapper.querySelector('select');
        const menu = wrapper.querySelector('.cafm-create-dropdown-menu');
        toggle.onclick = event => { event.stopPropagation(); const opening = menu.hidden; closeMenus(menu); menu.hidden = !opening; toggle.setAttribute('aria-expanded', opening ? 'true' : 'false'); };
        menu.querySelectorAll('[data-cafm-select-value]').forEach(option => option.onclick = () => {
          select.value = option.dataset.cafmSelectValue;
          toggle.querySelector('span').textContent = option.dataset.cafmSelectValue || ('Select ' + wrapper.querySelector('label').childNodes[0].textContent);
          menu.querySelectorAll('[role="option"]').forEach(item => item.setAttribute('aria-selected', item === option ? 'true' : 'false'));
          menu.hidden = true; toggle.setAttribute('aria-expanded', 'false'); select.dispatchEvent(new Event('change', { bubbles:true }));
        });
      });
      form.querySelectorAll('.cafm-create-link').forEach(wrapper => {
        const input = wrapper.querySelector('input');
        const menu = wrapper.querySelector('.cafm-create-link-menu');
        let timer;
        const search = () => {
          clearTimeout(timer);
          timer = setTimeout(() => frappe.call({ method:'cafm.api.search_cafm_link', args:{ doctype, fieldname:input.name, txt:input.value }, callback: response => {
            const rows = response.message || [];
            menu.innerHTML = rows.length ? rows.map(row => '<button type="button" data-link-value="' + esc(row.name) + '">' + esc(row.name) + '</button>').join('') : '<span>No matches</span>';
            menu.hidden = false;
            menu.querySelectorAll('[data-link-value]').forEach(button => button.onclick = () => { input.value = button.dataset.linkValue; menu.hidden = true; input.dispatchEvent(new Event('change', { bubbles:true })); });
          }}), 180);
        };
        input.addEventListener('focus', search); input.addEventListener('input', search);
      });
      const docValues = () => Object.fromEntries(fields.map(field => { const control=form.elements[field.fieldname]; return [field.fieldname, field.fieldtype === 'Table' ? [] : field.fieldtype === 'Check' ? Boolean(control && control.checked) : (control ? control.value : '')]; }));
      const evaluate = (rule, doc) => {
        if (!rule) return false;
        if (rule.startsWith('eval:')) { try { return Boolean(Function('doc', 'return (' + rule.slice(5) + ')')(doc)); } catch (_) { return false; } }
        return Boolean(doc[rule]);
      };
      const refreshDependencies = () => {
        const doc = docValues();
        fields.forEach(field => {
          const wrapper=form.querySelector('[data-cafm-field="' + CSS.escape(field.fieldname) + '"]'); if(!wrapper)return;
          const visible=!field.depends_on || evaluate(field.depends_on,doc); wrapper.hidden=!visible;
          const required=visible && (field.required || evaluate(field.mandatory_depends_on,doc)); wrapper.dataset.currentRequired=required?'1':'0';
          const mark=wrapper.querySelector('[data-required-mark]'); if(mark)mark.hidden=!required;
          const control=form.elements[field.fieldname]; if(control && field.fieldtype !== 'Select') control.required=required;
          if(control) control.disabled=visible && evaluate(field.read_only_depends_on,doc);
        });
      };
      form.addEventListener('change', refreshDependencies); form.addEventListener('input', refreshDependencies);
      document.addEventListener('click', () => closeMenus());
      refreshDependencies();
    };
    frappe.call({
      method: "cafm.api.get_cafm_create_schema",
      args: { doctype },
      callback: response => {
        const schema = response.message || {};
        const fields = schema.fields || [];
        const prepareField = field => {
          const hasInitialValue = Object.prototype.hasOwnProperty.call(initialValues, field.fieldname) && initialValues[field.fieldname] !== null;
          if (hasInitialValue) field.default = initialValues[field.fieldname];
          else if (field.fieldtype === 'Select') field.default = null;
        };
        fields.forEach(prepareField);
        (schema.sections || []).forEach(section => (section.fields || []).forEach(prepareField));
        const sections = schema.sections && schema.sections.length ? schema.sections : [{ value: "details", label: "Details", fields }];
        const fieldSections = Object.fromEntries(sections.flatMap(section => (section.fields || []).map(field => [field.fieldname, section.label || "Details"])));
        drawer.querySelector(".cafm-record-preview-panel").innerHTML = '<header><div><p>CREATE RECORD</p><h2>Create ' + esc(schema.label || doctype) + '</h2><span>Complete the required information below.</span></div><button type="button" data-create-close aria-label="Close">&times;</button></header>'
          + '<form class="cafm-create-form" novalidate>' + drawerSections(sections, renderCreateFields) + '<div class="cafm-create-error" hidden></div><footer><button type="button" class="cafm-record-preview-secondary" data-create-close>Cancel</button><button type="submit" class="cafm-record-preview-primary">Create ' + esc(schema.label || doctype) + '</button></footer></form>';
        drawer.querySelectorAll("[data-create-close]").forEach(button => button.onclick = () => close(false));
        const form = drawer.querySelector(".cafm-create-form");
        bindCreateControls(form, doctype, fields);
        const showMissingAlert = sectionLabel => {
          const alerts = drawer.querySelector('.cafm-create-alerts');
          if (!alerts || alerts.children.length >= 3) return;
          const alert = document.createElement('div');
          alert.className = 'cafm-create-alert';
          alert.innerHTML = '<span aria-hidden="true">!</span><div><strong>Required information missing</strong><p>Complete ' + esc(sectionLabel) + ' before creating this record.</p></div>';
          alerts.appendChild(alert);
          setTimeout(() => {
            alert.classList.add('is-leaving');
            setTimeout(() => alert.remove(), 220);
          }, 3000);
        };
        form.onsubmit = event => {
          event.preventDefault();
          const submit = form.querySelector('button[type="submit"]');
          const errorBox = form.querySelector(".cafm-create-error");
          let missingControl = null;
          let missingLabel = '';
          const missing = fields.find(field => {
            const wrapper = form.querySelector('[data-cafm-field="' + CSS.escape(field.fieldname) + '"]');
            const control = form.elements[field.fieldname];
            if (!wrapper || wrapper.hidden) return false;
            if (field.fieldtype === "Table") {
              const rows = [...wrapper.querySelectorAll('.cafm-create-child-row')];
              if (!rows.length) {
                if (wrapper.dataset.currentRequired !== "1") return false;
                missingControl = wrapper.querySelector('[data-add-child-row]'); missingLabel = field.label; return true;
              }
              for (const row of rows) {
                const missingChild = (field.child_fields || []).find(child => {
                  if (!child.required) return false;
                  const childControl = row.querySelector('[data-child-field="' + CSS.escape(child.fieldname) + '"]');
                  const empty = childControl && (child.fieldtype === 'Check' ? !childControl.checked : !String(childControl.value || '').trim());
                  if (empty) { missingControl = childControl; missingLabel = child.label; }
                  return empty;
                });
                if (missingChild) return true;
              }
              return false;
            }
            if (wrapper.dataset.currentRequired !== "1") return false;
            const empty = control && (field.fieldtype === "Check" ? !control.checked : !String(control.value || '').trim());
            if (empty) { missingControl = control; missingLabel = field.label; }
            return empty;
          });

          }

          submit.textContent = "Creating...";
          errorBox.hidden = true;

            const control = form.elements[field.fieldname];

              const wrapper = form.querySelector('[data-cafm-field="' + CSS.escape(field.fieldname) + '"]');

            method: "cafm.api.create_cafm_record",

      cancelOpen();

      }, 1000);
    };

      trigger.addEventListener('mouseenter', () => open(trigger));
      trigger.addEventListener('mouseleave', close);

      + '        <button class="cafm-app-work-row" data-preview-doctype="Facility Work Order" data-preview-name="' + esc(order.name) + '" data-route="/app/facility-work-order/' + esc(order.name) + '">'
      + '          <span class="cafm-app-priority ' + esc(String(order.priority || "").toLowerCase()) + '">' + esc(order.priority || "Not set") + '</span>'
      + '          <div><strong>' + esc(order.subject || order.name) + '</strong><small>' + esc(order.facility_location || "No location set") + ' - due ' + esc(order.planned_end || "Not scheduled") + '</small></div>'
      + '          <em>' + esc(order.work_order_status) + '</em><b>></b>'
      + '        </button>'
      + '      ').join("") : '<div class="cafm-app-empty"><strong>No active work orders</strong><span>New and assigned work will appear here.</span></div>') + '</div>'
      + '    </section>'
      + '  </main>'
      + '</div>';
    root.querySelectorAll("[data-route]").forEach(button => button.onclick = () => route(button.dataset.route));
    root.querySelectorAll("[data-preview-doctype][data-preview-name]").forEach(button => button.onclick = event => {
      if (!button.dataset.previewDoctype || !button.dataset.previewName) return;
      event.preventDefault();
      window.cafmOpenRecordPreview(button.dataset.previewDoctype, button.dataset.previewName);
    });
    root.querySelectorAll("[data-create-doctype]").forEach(button => button.onclick = () => window.cafmOpenCreateDrawer(button.dataset.createDoctype));
    bindNavHoverCards();
    root.querySelector(".cafm-app-refresh").onclick = load;
    const shell = root.querySelector(".cafm-app-shell");
    const collapseButton = root.querySelector(".cafm-app-collapse");
    const accountWrap = root.querySelector(".cafm-app-account-wrap");
    const accountButton = root.querySelector(".cafm-app-account-button");
    const accountMenu = root.querySelector(".cafm-app-account-menu");
    let accountOpenedFromCollapsed = false;

    const setSidebarCollapsed = collapsed => {
      shell.classList.toggle("is-collapsed", collapsed);
      collapseButton.querySelector("span:not(.cafm-app-collapse-icon)").textContent = collapsed ? "Expand" : "Collapse";
      collapseButton.querySelector(".cafm-app-collapse-icon").innerHTML = icon(collapsed ? "right" : "left");
      collapseButton.removeAttribute("title");
      localStorage.setItem("cafm-sidebar-collapsed", collapsed ? "1" : "0");
    };
    const openAccountMenu = () => {
      accountMenu.hidden = false;
      accountMenu.classList.add("is-opening");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        accountMenu.classList.remove("is-opening");
      }));
    };
    const closeAccountMenu = () => {
      if (accountMenu.hidden) return;
      accountMenu.hidden = true;
      accountButton.setAttribute("aria-expanded", "false");
      if (accountOpenedFromCollapsed) {
        accountOpenedFromCollapsed = false;
        setSidebarCollapsed(true);
      }
    };

    setSidebarCollapsed(localStorage.getItem("cafm-sidebar-collapsed") === "1");
    accountButton.onclick = () => {
      if (shell.classList.contains("is-collapsed")) {
        accountOpenedFromCollapsed = true;
        setSidebarCollapsed(false);
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
        return;
      }
      if (accountMenu.hidden) {
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
      } else {
        closeAccountMenu();
      }
    };
    root.addEventListener("click", event => {
      if (!accountWrap.contains(event.target)) closeAccountMenu();
    });
    root.querySelector(".cafm-app-account-about").onclick = () => frappe.msgprint({
      title: "CAFM Operations",
      message: "Your facilities workspace for maintenance, assets, vendors, SLA, and utilities.",
      indicator: "blue"
    });
    root.querySelector(".cafm-app-account-logout").onclick = () => frappe.call({
      method: "logout",
      callback: response => { if (!response.exc) route("/login?redirect-to=" + encodeURIComponent(window.location.pathname + window.location.search)); }
    });


    collapseButton.onclick = () => {
      accountOpenedFromCollapsed = false;
      setSidebarCollapsed(!shell.classList.contains("is-collapsed"));
    };
    root.querySelectorAll(".cafm-app-nav-group summary").forEach(summary => {
      summary.onclick = event => {
        event.preventDefault();
        const group = summary.parentElement;
        if (group.classList.contains("is-animating")) return;
        if (shell.classList.contains("is-collapsed")) {
          setSidebarCollapsed(false);
          group.open = true;
          group.classList.add("is-opening", "is-animating");
          requestAnimationFrame(() => requestAnimationFrame(() => group.classList.remove("is-opening")));
          setTimeout(() => group.classList.remove("is-animating"), 230);
          return;
        }
        if (group.open) {
          group.classList.add("is-closing", "is-animating");
          setTimeout(() => {
            group.open = false;
            group.classList.remove("is-closing", "is-animating");
          }, 220);
        } else {
          group.open = true;
          group.classList.add("is-opening", "is-animating");
          requestAnimationFrame(() => requestAnimationFrame(() => group.classList.remove("is-opening")));
          setTimeout(() => group.classList.remove("is-animating"), 230);
        }
      };
    });
  }

  function load() {
    root.innerHTML = '<div class="cafm-app-loading">Loading CAFM Operations...</div>';
    frappe.call({
      method: "cafm.api.get_cafm_operations_dashboard",
      callback: response => render(response.message || {}),
      error: error => {
        const message = error && error.message ? error.message : "You do not have access to this view.";
        root.innerHTML = '<div class="cafm-app-error"><h2>CAFM Operations</h2><p>' + esc(message) + '</p><a href="/app">Return to Desk</a></div>';
      }
    });
  }
  load();
});
</script>

<script>
frappe.ready(function(){
 const root=document.getElementById("cafm-app-view"); if(!root) return;
 const esc=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const badgeTheme=(value,fieldname)=>{const text=String(value??"").toLowerCase();const field=String(fieldname||"").toLowerCase();if(/frequency/.test(field)){if(/daily/.test(text))return "red";if(/weekly/.test(text))return "amber";if(/monthly/.test(text))return "blue";if(/quarterly|biannual|semi-annual/.test(text))return "violet";if(/yearly|annual/.test(text))return "green";return "teal";}if(/critical|breach|overdue|rejected|cancelled|expired|failed/.test(text))return "red";if(/high|in progress|pending|due soon/.test(text))return "amber";if(/resolved|closed|completed|met|on track|approved|matched/.test(text))return "green";if(/low/.test(text))return "teal";if(/medium|assigned|new|draft|open/.test(text))return "blue";if(/type/.test(String(fieldname||"").toLowerCase()))return "violet";return "gray";};
 const badge=(value,fieldname)=>{const text=value===null||value===undefined||value===""?"Not set":String(value);const checked=/resolved|closed|completed|met|on track|approved|matched/.test(text.toLowerCase());return '<span class="cafm-subtle-badge '+badgeTheme(text,fieldname)+'">'+(checked?'<span class="cafm-subtle-badge-icon" aria-hidden="true">&#10003;</span>':'')+'<span>'+esc(text)+'</span></span>';};
 const isBadgeField=fieldname=>/(priority|status|type|frequency)/.test(String(fieldname||"").toLowerCase());
 const views={
  "/app/issue":{doctype:"Issue",label:"Requests",createLabel:"Request"},
  "/app/facility-work-order":{doctype:"Facility Work Order",label:"Work orders"},
  "/app/preventive-maintenance-plan":{doctype:"Preventive Maintenance Plan",label:"Preventive maintenance plan"},
  "/app/facility-inspection":{doctype:"Facility Inspection",label:"Inspections"},
  "/app/asset":{doctype:"Asset",label:"Assets"},
  "/app/facility-location":{doctype:"Facility Location",label:"Locations"},
  "/app/asset-category":{doctype:"Asset Category",label:"Asset categories"},
  "/app/facility-service-provider":{doctype:"Facility Service Provider",label:"Service providers"},
  "/app/facility-service-contract":{doctype:"Facility Service Contract",label:"Service contracts"},
  "/app/facility-vendor-quotation":{doctype:"Facility Vendor Quotation",label:"Vendor quotations"},
  "/app/facility-sla-policy":{doctype:"Facility SLA Policy",label:"SLA policies"},
  "/app/utility-meter":{doctype:"Utility Meter",label:"Utility meters"},
  "/app/utility-reading":{doctype:"Utility Reading",label:"Utility readings"},
  "/app/utility-bill":{doctype:"Utility Bill",label:"Utility bills"},
  "/app/utility-budget":{doctype:"Utility Budget",label:"Utility budgets"}
 };

 function showAnalytics(){
  const main=root.querySelector(".cafm-app-main");
  if(!main){setTimeout(showAnalytics,100);return;}
  root.querySelectorAll(".cafm-app-nav-item").forEach(item=>item.classList.toggle("active",item.dataset.route==="/dashboard"));
  main.classList.add("cafm-app-main-analytics");
  main.innerHTML='<section class="cafm-dashboard-embed"><div class="cafm-dashboard-embed-loading">Loading analytics...</div><iframe src="/dashboard" title="CAFM Analytics"></iframe></section>';
  const frame=main.querySelector("iframe");
  frame.addEventListener("load",()=>{frame.classList.add("is-ready");main.querySelector(".cafm-dashboard-embed-loading")?.remove();});
 }

 function showDoctype(route){
  const config=views[route]; if(!config) return;
  const main=root.querySelector(".cafm-app-main");
  if(!main){setTimeout(()=>showDoctype(route),100);return;}
  main.classList.remove("cafm-app-main-analytics");
  root.querySelectorAll(".cafm-app-nav-item").forEach(item=>item.classList.toggle("active",item.dataset.route===route));
  main.innerHTML='<div class="cafm-app-loading">Loading '+esc(config.label.toLowerCase())+'...</div>';

  frappe.call({
   method:"cafm.api.get_cafm_doctype_view",
   args:{doctype:config.doctype},
   callback:response=>renderDoctype(route,config,response.message||{}),
   error:error=>{
    const message=error&&error.message?error.message:"Unable to load records.";
    main.innerHTML='<div class="cafm-app-error"><h2>'+esc(config.label)+'</h2><p>'+esc(message)+'</p></div>';
   }
  });
 }

 function renderDoctype(route,config,data){
  const main=root.querySelector(".cafm-app-main"); if(!main) return;
  const rows=data.rows||[],columns=data.columns||[];
  const groupField=data.group_field;
  const appRoute=route;
  const display=value=>{
   if(value===null||value===undefined||value==="")return "-";
   return String(value);
  };
  const recordUrl=name=>appRoute+"/"+encodeURIComponent(name);
  const searchText=row=>columns.map(column=>display(row[column.fieldname])).join(" ").toLowerCase();

  const header=columns.map(column=>'<th>'+esc(column.label)+'</th>').join("");
  const tableRows=rows.map(row=>'<tr data-record-search="'+esc(searchText(row))+'" data-generic-preview-name="'+esc(row.name)+'">'+columns.map((column,index)=>{
   const text=display(row[column.fieldname]);
   const content=isBadgeField(column.fieldname)?badge(text,column.fieldname):esc(text);
   return '<td>'+(index===0?'<button class="cafm-record-link" type="button">'+esc(text)+'</button>':content)+'</td>';
  }).join("")+'</tr>').join("");

  const groups={};
  rows.forEach(row=>{
   const label=groupField?display(row[groupField]):"All records";
   (groups[label]||(groups[label]=[])).push(row);
  });
  const groupEntries=Object.entries(groups).sort((left,right)=>right[1].length-left[1].length);
  const top=groupEntries[0]||["No group",[]];
  const dashboard='<section class="cafm-request-dashboard">'
   +'<div class="cafm-request-metric"><small>TOTAL RECORDS</small><strong>'+rows.length+'</strong><span>Visible to your account</span></div>'
   +'<div class="cafm-request-metric"><small>GROUPS</small><strong>'+groupEntries.length+'</strong><span>'+(groupField?esc(columns.find(column=>column.fieldname===groupField)?.label||groupField):"All records")+'</span></div>'
   +'<div class="cafm-request-metric"><small>LARGEST GROUP</small><strong>'+top[1].length+'</strong><span>'+esc(top[0])+'</span></div>'
   +'<div class="cafm-request-chart"><h3>'+esc(config.label)+' by '+esc(groupField?(columns.find(column=>column.fieldname===groupField)?.label||groupField):"record group")+'</h3>'
   +groupEntries.map(entry=>'<div class="cafm-request-bar"><span>'+esc(entry[0])+'</span><i><b style="width:'+((entry[1].length/Math.max(rows.length,1))*100)+'%"></b></i><em>'+entry[1].length+'</em></div>').join("")
   +'</div></section>';

  const board='<section class="cafm-request-board">'+groupEntries.map(entry=>'<div class="cafm-request-lane"><header><strong>'+esc(entry[0])+'</strong><span>'+entry[1].length+'</span></header>'
   +entry[1].map(row=>'<button type="button" data-generic-preview-name="'+esc(row.name)+'"><small>'+esc(row.name)+'</small><b>'+esc(row[data.title_field]||row.name)+'</b><span class="cafm-request-card-badges">'+(isBadgeField(groupField)?badge(display(row[groupField]),groupField):'<span>'+esc(config.doctype)+'</span>')+'</span></button>').join("")
   +'</div>').join("")+'</section>';

  main.innerHTML='<header class="cafm-app-header"><div><p>CAFM RECORDS</p><h1>'+esc(config.label)+'</h1><span>Search, review, create, and analyse '+esc(config.label.toLowerCase())+'.</span></div><div class="cafm-request-actions"><button class="cafm-app-refresh" type="button" data-generic-refresh><span>&#8635;</span><em>Refresh</em></button>'+(data.can_create?'<button class="cafm-request-create" data-generic-create>+ Create '+esc(config.createLabel||config.doctype)+'</button>':'')+'</div></header>'
   +'<section class="cafm-request-toolbar"><input type="search" data-generic-search placeholder="Search by ID or displayed fields"><div class="cafm-request-view-menu"><span>View</span><button type="button" data-generic-view-button aria-expanded="false">Table <b>&#8964;</b></button><div class="cafm-view-options" data-generic-view-options hidden><button type="button" data-generic-mode="table">Table</button><button type="button" data-generic-mode="dashboard">Dashboard</button><button type="button" data-generic-mode="kanban">Kanban</button></div></div><span>'+rows.length+' records</span></section>'
   +dashboard+board+'<section class="cafm-request-list" data-generic-list><div class="cafm-request-table-wrap"><table><thead><tr>'+header+'</tr></thead><tbody>'+tableRows+'</tbody></table></div></section>';

  main.querySelector("[data-generic-refresh]").onclick=event=>{event.preventDefault();event.stopPropagation();const currentRoute=route;requestAnimationFrame(()=>showDoctype(currentRoute));};
  main.querySelectorAll("[data-generic-preview-name]").forEach(button=>button.onclick=event=>{event.preventDefault();window.cafmOpenRecordPreview(config.doctype,button.dataset.genericPreviewName);});
  const create=main.querySelector("[data-generic-create]"); if(create)create.onclick=()=>window.cafmOpenCreateDrawer(config.doctype);
  main.querySelector("[data-generic-search]").oninput=event=>{
   const query=event.target.value.toLowerCase();
   main.querySelectorAll("[data-record-search]").forEach(element=>element.style.display=!query||element.dataset.recordSearch.includes(query)?"":"none");
  };

  const viewButton=main.querySelector("[data-generic-view-button]");
  const viewOptions=main.querySelector("[data-generic-view-options]");
  const applyView=mode=>{
   main.querySelector(".cafm-request-dashboard").classList.toggle("visible",mode==="dashboard");
   main.querySelector(".cafm-request-board").classList.toggle("visible",mode==="kanban");
   main.querySelector("[data-generic-list]").style.display=mode==="table"?"":"none";
   viewButton.firstChild.nodeValue={table:"Table",dashboard:"Dashboard",kanban:"Kanban"}[mode]+" ";
   viewOptions.hidden=true;
   viewButton.setAttribute("aria-expanded","false");
  };
  viewButton.onclick=()=>{
   viewOptions.style.width=viewButton.offsetWidth+"px";
   const opening=viewOptions.hidden;
   viewOptions.hidden=!opening;
   viewButton.setAttribute("aria-expanded",opening?"true":"false");
  };
  viewOptions.querySelectorAll("[data-generic-mode]").forEach(button=>button.onclick=()=>applyView(button.dataset.genericMode));
  history.replaceState({},"","/cafm?section="+encodeURIComponent(config.doctype));
 }

 root.addEventListener("click",event=>{
  const item=event.target.closest("[data-route]");
  const route=item&&item.dataset.route;
  if(route!=="/dashboard"&&!views[route])return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if(route==="/dashboard")showAnalytics(); else showDoctype(route);
 },true);

 const requested=new URLSearchParams(location.search).get("section");
 const route=Object.keys(views).find(key=>views[key].doctype===requested);
 if(route)showDoctype(route);
});
</script>

.cafm-app-workspace-link{display:flex;align-items:center;justify-content:center;gap:8px;transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease}.cafm-app-workspace-link .cafm-app-icon{width:17px;height:17px;flex:0 0 17px}.cafm-app-workspace-link:hover{transform:translateY(-1px)}.cafm-app-shell.is-collapsed .cafm-app-workspace-link{width:44px;height:44px;box-sizing:border-box;margin:18px auto 0;padding:0;border-radius:11px}.cafm-app-shell.is-collapsed .cafm-app-workspace-link .cafm-app-icon{width:20px;height:20px;flex-basis:20px}
</style>
<style>
html.cafm-drawer-open,
body.cafm-drawer-open {
  overflow:hidden!important;
  overscroll-behavior:none;
}
body.cafm-drawer-open {
  touch-action:none;
}
.cafm-record-preview-panel {
  overscroll-behavior:contain;
  touch-action:pan-y;
}
</style>
<style>
.cafm-native-section-scroll {
  min-width:0;
  padding:0 2px 24px 0;
}
.cafm-native-section {
  padding:4px 0 24px;
}
.cafm-native-section+.cafm-native-section {
  padding-top:20px;
}
.cafm-native-section>h3 {
  margin:0 0 14px;
  padding-bottom:8px;
  border-bottom:1px solid #d8e5ed;
  color:#244c68;
  font-size:13px;
  font-weight:800;
}
.cafm-create-form>.cafm-native-section-scroll {
  margin-top:0;
}
.cafm-create-form>.cafm-native-section-scroll+.cafm-create-error {
  margin-top:14px;
}

.cafm-request-create { cursor:pointer; box-shadow:0 3px 8px rgba(20,88,137,.14); transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease; }
.cafm-request-create:hover { background:#0d527f; box-shadow:0 7px 16px rgba(20,88,137,.25); transform:translateY(-1px); }
.cafm-request-create:active { background:#0a476f; box-shadow:0 2px 5px rgba(20,88,137,.18); transform:translateY(0); }
.cafm-create-child-table { margin-top:16px; }
.cafm-create-table-header,.cafm-create-child-row { grid-template-columns:repeat(var(--child-columns),150px) 34px; width:max-content; min-width:100%; box-sizing:border-box; }
.cafm-create-table-header>span,.cafm-create-child-row>input,.cafm-create-child-row>select { box-sizing:border-box; min-width:0; }
.cafm-create-child-row input:not([type="checkbox"]),.cafm-create-child-row select { min-width:0; height:36px; }

.cafm-record-preview-panel>footer { align-items:center; justify-content:space-between; }
.cafm-record-footer-buttons { display:flex; gap:9px; }
.cafm-record-actions { position:relative; }
.cafm-record-actions-toggle { display:flex; align-items:center; gap:8px; min-height:39px; padding:9px 13px; border:1px solid #9dbfd3; border-radius:9px; background:#e7f3fa; color:#225f85; font-size:12px; font-weight:800; cursor:pointer; }
.cafm-record-actions-toggle:hover,.cafm-record-actions-toggle[aria-expanded="true"] { background:#d8ebf6; border-color:#5593b8; }
.cafm-record-actions-toggle b { transition:transform .15s ease; }
.cafm-record-actions-toggle[aria-expanded="true"] b { transform:rotate(180deg); }
.cafm-record-actions-menu { position:absolute; bottom:calc(100% + 7px); left:0; z-index:35; width:220px; padding:6px; border:1px solid #b9d2e0; border-radius:11px; background:#fff; box-shadow:0 14px 30px rgba(17,53,78,.2); }
.cafm-record-actions-menu[hidden] { display:none; }
.cafm-record-actions-menu button { display:flex; align-items:center; gap:9px; width:100%; padding:9px 10px; border:0; border-radius:7px; background:transparent; color:#31566f; font-size:12px; text-align:left; cursor:pointer; }
.cafm-record-actions-menu button:hover { background:#e5f2fa; color:#155f91; }
.cafm-record-actions-menu .cafm-app-icon { width:16px; height:16px; flex:0 0 16px; }
.cafm-qr-dialog { position:fixed; inset:0; z-index:1100; display:grid; place-items:center; padding:20px; }
.cafm-qr-backdrop { position:absolute; inset:0; border:0; background:rgba(12,35,52,.48); backdrop-filter:blur(2px); }
.cafm-qr-dialog>section { position:relative; z-index:1; display:grid; justify-items:center; width:min(390px,94vw); padding:25px; border-radius:16px; background:#fff; box-shadow:0 18px 45px rgba(10,39,61,.28); text-align:center; }
.cafm-qr-dialog>section>button[data-qr-close] { position:absolute; top:11px; right:13px; border:0; background:transparent; color:#426b84; font-size:24px; cursor:pointer; }
.cafm-qr-dialog p { margin:0; color:#397594; font-size:10px; font-weight:900; letter-spacing:.8px; }
.cafm-qr-dialog h3 { margin:6px 25px 17px; color:#173650; font-size:18px; }
.cafm-qr-dialog img { width:min(260px,100%); min-height:180px; object-fit:contain; image-rendering:pixelated; }
.cafm-qr-dialog span { margin:14px 0; color:#668095; font-size:12px; }
@media(max-width:600px){.cafm-record-preview-panel>footer{align-items:stretch;flex-direction:column}.cafm-record-footer-buttons{justify-content:flex-end}.cafm-record-actions-menu{bottom:auto;top:calc(100% + 7px)}}

.cafm-record-header-controls { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.cafm-record-preview-panel>header .cafm-record-actions-toggle { display:flex; width:auto; min-width:92px; height:36px; padding:8px 11px; border:1px solid #9dbfd3; border-radius:9px; background:#e7f3fa; color:#225f85; font-size:12px; line-height:1; }
.cafm-record-preview-panel>header .cafm-record-actions-toggle:hover,.cafm-record-preview-panel>header .cafm-record-actions-toggle[aria-expanded="true"] { background:#d8ebf6; border-color:#5593b8; }
.cafm-record-preview-panel>header .cafm-record-actions-menu { top:calc(100% + 7px); right:0; bottom:auto; left:auto; }
.cafm-record-preview-panel>header .cafm-record-actions-menu button { display:flex; width:100%; height:auto; min-height:36px; padding:9px 10px; border:0; border-radius:7px; background:transparent; font-size:12px; }
.cafm-record-preview-panel>header .cafm-record-actions-menu button:hover { background:#e5f2fa; }

.cafm-qr-dialog [data-qr-download] { padding:10px 16px; border-radius:10px; cursor:pointer; }

.cafm-history-dialog { position:fixed; inset:0; z-index:1100; display:grid; place-items:center; padding:24px; }
.cafm-history-backdrop { position:absolute; inset:0; border:0; background:rgba(12,35,52,.5); backdrop-filter:blur(2px); }
.cafm-history-dialog>section { position:relative; z-index:1; width:min(980px,96vw); max-height:86vh; overflow:hidden; border-radius:17px; background:#f5f9fc; box-shadow:0 20px 50px rgba(10,39,61,.3); }
.cafm-history-dialog>section>header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:22px 24px 17px; border-bottom:1px solid #d5e3ec; background:#fff; }
.cafm-history-dialog header p { margin:0; color:#397594; font-size:10px; font-weight:900; letter-spacing:.8px; }
.cafm-history-dialog header h3 { margin:5px 0; color:#173650; font-size:21px; }
.cafm-history-dialog header span { color:#668095; font-size:12px; }
.cafm-history-dialog header>button { display:grid; place-items:center; width:36px; height:36px; border:1px solid #cbdde8; border-radius:10px; background:#fff; color:#315b76; font-size:23px; cursor:pointer; }
.cafm-history-content { max-height:calc(86vh - 100px); overflow:auto; padding:18px; }
.cafm-history-table-wrap { overflow:auto; border:1px solid #d7e4ec; border-radius:12px; background:#fff; }
.cafm-history-table-wrap table { width:100%; border-collapse:collapse; white-space:nowrap; }
.cafm-history-table-wrap th { padding:11px 12px; background:#eaf4f9; color:#487391; text-align:left; font-size:10px; text-transform:uppercase; }
.cafm-history-table-wrap td { padding:11px 12px; border-top:1px solid #e4edf3; color:#49647a; font-size:11px; }
.cafm-history-table-wrap td button { padding:0; border:0; background:transparent; color:#1767a0; font:inherit; font-weight:800; cursor:pointer; }
.cafm-history-table-wrap td button:hover { text-decoration:underline; }
</style>
