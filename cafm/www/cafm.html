{% extends "templates/web.html" %}
{% block title %}CAFM Operations
{% endblock %}
{% block page_content %}
<div id="cafm-app-view">
  <div class="cafm-app-loading">Loading CAFM Operations...</div>
</div>
<script>
frappe.ready(function () {
  const root = document.getElementById("cafm-app-view");
  const esc = value => String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const route = value => window.location.href = value;

  function icon(name) {
    const paths = {
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
      maintenance: '<path d="m14 6 4-4 2 2-4 4M3 21l7-7 3 3-7 7H3Z"/><path d="m8 4 3 3-3 3-3-3Z"/>',
      assets: '<rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      vendors: '<path d="M4 20V7a2 2 0 0 1 2-2h8v15"/><path d="M14 10h4a2 2 0 0 1 2 2v8M8 9h2m-2 4h2m-2 4h2m7-3h1m-1 3h1"/>',
      utilities: '<path d="M13 2 5 13h6l-1 9 8-12h-6Z"/>',
      analytics: '<path d="M4 20V10m8 10V4m8 16v-7"/><path d="M2 20h20"/>',
      left: '<path d="m15 18-6-6 6-6"/>',
      right: '<path d="m9 18 6-6-6-6"/>'
    };
    return '<svg class="cafm-app-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || '') + '</svg>';
  }


  window.cafmOpenRecordPreview = function(doctype, name) {
    const previous = root.querySelector(".cafm-record-preview");
    if (previous) previous.remove();
    const close = () => {
      const preview = root.querySelector(".cafm-record-preview");
      if (!preview || preview.classList.contains("is-closing")) return;
      preview.classList.add("is-closing");
      setTimeout(() => preview.remove(), 180);
    };
    const badgeClass = (value, fieldname) => {
      const text = String(value || "").toLowerCase();
      const field = String(fieldname || "").toLowerCase();
      if (/critical|breach|overdue|failed|cancelled|rejected/.test(text)) return "red";
      if (/high|pending|in progress/.test(text)) return "amber";
      if (/completed|closed|resolved|approved|active|met/.test(text)) return "green";
      if (/medium|assigned|new|draft|open/.test(text)) return "blue";
      if (/low|frequency/.test(text + field)) return "teal";
      if (/type/.test(field)) return "violet";
      return "gray";
    };
    const fieldValue = field => {
      const text = field.value === null || field.value === undefined || field.value === "" ? "-" : String(field.value);
      const isBadge = /(priority|status|type|frequency)/.test(String(field.fieldname || "").toLowerCase());
      return '<div class="cafm-record-preview-field"><small>' + esc(field.label) + '</small>' + (isBadge ? '<span class="cafm-subtle-badge ' + badgeClass(text, field.fieldname) + '"><span>' + esc(text) + '</span></span>' : '<strong>' + esc(text) + '</strong>') + '</div>';
    };
    root.insertAdjacentHTML("beforeend", '<div class="cafm-record-preview" role="dialog" aria-modal="true"><button class="cafm-record-preview-backdrop" data-generic-preview-close aria-label="Close"></button><section class="cafm-record-preview-panel"><div class="cafm-record-preview-loading">Loading record...</div></section></div>');
    const preview = root.querySelector(".cafm-record-preview");
    preview.querySelector("[data-generic-preview-close]").onclick = close;
    frappe.call({
      method: "cafm.api.get_cafm_doctype_detail",
      args: { doctype, name },
      callback: response => {
        const item = response.message || {};
        preview.querySelector(".cafm-record-preview-panel").innerHTML = '<header><div><p>' + esc(item.doctype || doctype) + '</p><h2>' + esc(item.title || item.name) + '</h2><span>' + esc(item.name) + '</span></div><button type="button" data-generic-preview-close aria-label="Close">&times;</button></header>'
          + '<div class="cafm-record-preview-grid cafm-generic-preview-grid">' + (item.fields || []).map(fieldValue).join("") + '</div>'
          + (item.description ? '<section class="cafm-record-preview-description"><small>DETAILS</small><p>' + esc(item.description) + '</p></section>' : '')
          + '<footer><button type="button" class="cafm-record-preview-secondary" data-generic-preview-close>Close</button><button type="button" class="cafm-record-preview-primary" data-generic-preview-open>Open full record</button></footer>';
        preview.querySelectorAll("[data-generic-preview-close]").forEach(button => button.onclick = close);
        preview.querySelector("[data-generic-preview-open]").onclick = () => window.location.href = item.route;
      },
      error: () => {
        preview.querySelector(".cafm-record-preview-panel").innerHTML = '<div class="cafm-record-preview-error"><h2>Could not load record</h2><p>You may not have permission to view it.</p><button data-generic-preview-close>Close</button></div>';
        preview.querySelector("[data-generic-preview-close]").onclick = close;
      }
    });
  };

  window.cafmOpenCreateDrawer = function(doctype) {
    root.querySelector(".cafm-record-preview")?.remove();
    const close = (refresh) => {
      const drawer = root.querySelector(".cafm-record-preview");
      if (!drawer || drawer.classList.contains("is-closing")) return;
      drawer.classList.add("is-closing");
      setTimeout(() => {
        drawer.remove();
        if (refresh) {
          const refreshButton = root.querySelector("[data-request-refresh],[data-generic-refresh],.cafm-app-header .cafm-app-refresh");
          if (refreshButton) refreshButton.click();
        }
      }, 180);
    };
    root.insertAdjacentHTML("beforeend", '<div class="cafm-record-preview cafm-create-drawer" role="dialog" aria-modal="true"><button class="cafm-record-preview-backdrop" data-create-close aria-label="Close"></button><section class="cafm-record-preview-panel"><div class="cafm-record-preview-loading">Loading creation form...</div></section></div>');
    const drawer = root.querySelector(".cafm-create-drawer");
    drawer.querySelector("[data-create-close]").onclick = () => close(false);
    const inputFor = (field, index) => {
      const required = field.required ? " required" : "";
      const value = field.default === null || field.default === undefined ? "" : String(field.default);
      const label = '<label for="cafm-create-' + index + '">' + esc(field.label) + (field.required ? '<b>*</b>' : '') + '</label>';
      if (field.fieldtype === "Select") {
        return '<div class="cafm-create-field">' + label + '<select id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '"' + required + '><option value="">Select ' + esc(field.label) + '</option>' + (field.options || []).map(option => '<option value="' + esc(option) + '"' + (option === value ? ' selected' : '') + '>' + esc(option) + '</option>').join("") + '</select></div>';
      }
      if (field.fieldtype === "Link") {
        const listId = "cafm-create-options-" + index;
        return '<div class="cafm-create-field">' + label + '<input id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '" value="' + esc(value) + '" list="' + listId + '" autocomplete="off"' + required + '><datalist id="' + listId + '">' + (field.options || []).map(option => '<option value="' + esc(option) + '"></option>').join("") + '</datalist><small>' + esc(field.link_doctype || "Linked record") + '</small></div>';
      }
      if (/Text/.test(field.fieldtype)) {
        return '<div class="cafm-create-field cafm-create-field-wide">' + label + '<textarea id="cafm-create-' + index + '" name="' + esc(field.fieldname) + '" rows="4"' + required + '>' + esc(value) + '</textarea></div>';
      }
      if (field.fieldtype === "Check") {
        return '<div class="cafm-create-field cafm-create-check"><label><input id="cafm-create-' + index + '" type="checkbox" name="' + esc(field.fieldname) + '" value="1"' + (String(value) === "1" ? " checked" : "") + '><span>' + esc(field.label) + '</span></label></div>';
      }
      const type = field.fieldtype === "Date" ? "date" : field.fieldtype === "Datetime" ? "datetime-local" : field.fieldtype === "Time" ? "time" : ["Int","Float","Currency","Percent"].includes(field.fieldtype) ? "number" : "text";
      return '<div class="cafm-create-field">' + label + '<input id="cafm-create-' + index + '" type="' + type + '" name="' + esc(field.fieldname) + '" value="' + esc(value) + '"' + required + '></div>';
    };
    frappe.call({
      method: "cafm.api.get_cafm_create_schema",
      args: { doctype },
      callback: response => {
        const schema = response.message || {};
        const fields = schema.fields || [];
        drawer.querySelector(".cafm-record-preview-panel").innerHTML = '<header><div><p>CREATE RECORD</p><h2>Create ' + esc(schema.label || doctype) + '</h2><span>Complete the required information below.</span></div><button type="button" data-create-close aria-label="Close">&times;</button></header>'
          + '<form class="cafm-create-form"><div class="cafm-create-grid">' + fields.map(inputFor).join("") + '</div><div class="cafm-create-error" hidden></div><footer><button type="button" class="cafm-record-preview-secondary" data-create-close>Cancel</button><button type="submit" class="cafm-record-preview-primary">Create ' + esc(schema.label || doctype) + '</button></footer></form>';
        drawer.querySelectorAll("[data-create-close]").forEach(button => button.onclick = () => close(false));
        const form = drawer.querySelector(".cafm-create-form");
        form.onsubmit = event => {
          event.preventDefault();
          const submit = form.querySelector('button[type="submit"]');
          const errorBox = form.querySelector(".cafm-create-error");
          submit.disabled = true;
          submit.textContent = "Creating...";
          errorBox.hidden = true;
          const values = {};
          fields.forEach(field => {
            const control = form.elements[field.fieldname];
            values[field.fieldname] = field.fieldtype === "Check" ? (control.checked ? 1 : 0) : control.value;
          });
          frappe.call({
            method: "cafm.api.create_cafm_record",
            type: "POST",
            args: { doctype, values: JSON.stringify(values) },
            callback: result => {
              const created = result.message || {};
              drawer.querySelector(".cafm-record-preview-panel").innerHTML = '<div class="cafm-create-success"><span>&#10003;</span><p>RECORD CREATED</p><h2>' + esc(created.title || created.name) + '</h2><small>' + esc(created.name) + '</small><div><button class="cafm-record-preview-secondary" data-created-close>Close</button><button class="cafm-record-preview-primary" data-created-open>View record</button></div></div>';
              drawer.querySelector("[data-created-close]").onclick = () => close(true);
              drawer.querySelector("[data-created-open]").onclick = () => {drawer.classList.add("is-closing");setTimeout(() => {drawer.remove();window.cafmOpenRecordPreview(created.doctype, created.name);}, 180);};
            },
            error: error => {
              submit.disabled = false;
              submit.textContent = "Create " + (schema.label || doctype);
              errorBox.textContent = (error && error.message) || "The record could not be created. Check the required fields and try again.";
              errorBox.hidden = false;
            }
          });
        };
      },
      error: () => {
        drawer.querySelector(".cafm-record-preview-panel").innerHTML = '<div class="cafm-record-preview-error"><h2>Could not load creation form</h2><p>You may not have permission to create this record.</p><button data-create-close>Close</button></div>';
        drawer.querySelector("[data-create-close]").onclick = () => close(false);
      }
    });
  };

  function navItem(label, href, active, iconName, hideArrow) {
    return '<button class="cafm-app-nav-item ' + (active ? "active" : "") + '" data-route="' + href + '" title="' + label + '">' + icon(iconName) + '<span>' + label + '</span>' + (hideArrow ? '' : '<b>></b>') + '</button>';
  }

  function navGroup(label, items, expanded, iconName) {
    return '<details class="cafm-app-nav-group"' + (expanded ? ' open' : '') + '>'
      + '<summary title="' + label + '">' + icon(iconName) + '<span>' + label + '</span><b>&#8964;</b></summary>'
      + '<div class="cafm-app-nav-group-items">' + items.map(item => navItem(item[0], item[1], false, item[2], item[3])).join("") + '</div>'
      + '</details>';
  }

  function render(data) {
    const stats = data.stats || [];
    const orders = data.work_orders || [];
    const name = data.user_full_name || "Facility team";
    const attention = data.attention || [];
    const todayItems = data.today || [];
    const quickActions = data.quick_actions || [];
    const operationalRows = (items, emptyTitle, emptyDetail) => items.length
      ? items.map(item => ''
        + '<button class="cafm-home-row" data-preview-doctype="' + esc(item.doctype || "") + '" data-preview-name="' + esc(item.name || "") + '" data-route="' + esc(item.route) + '">'
        + '  <div><small>' + esc(item.kind || "CAFM") + '</small><strong>' + esc(item.title) + '</strong><span>' + esc(item.detail || "") + '</span></div>'
        + '  <div class="cafm-home-row-meta"><em>' + esc(item.status || "") + '</em>' + (item.priority ? '<b class="cafm-app-priority ' + esc(String(item.priority).toLowerCase()) + '">' + esc(item.priority) + '</b>' : '') + '</div>'
        + '</button>').join("")
      : '<div class="cafm-app-empty"><strong>' + esc(emptyTitle) + '</strong><span>' + esc(emptyDetail) + '</span></div>';
    root.innerHTML = ''
      + '<div class="cafm-app-shell">'
      + '  <aside class="cafm-app-sidebar">'
      + '    <div class="cafm-app-brand"><span class="cafm-app-brand-mark">C</span><div><strong>CAFM</strong><small>OPERATIONS</small></div></div>'
      + '    <div class="cafm-app-account-wrap">'
      + '      <button class="cafm-app-user cafm-app-account-button" type="button" aria-expanded="false"><span>' + esc(name.split(" ").filter(Boolean).slice(0, 2).map(word => word[0]).join("").toUpperCase()) + '</span><div><small>FACILITY TEAM</small><strong>' + esc(name) + '</strong></div><b>&#8964;</b></button>'
      + '      <div class="cafm-app-account-menu" hidden>'
      + '        <button data-route="/app"><span>Apps</span></button>'
      + '        <button data-route="/app/user-profile"><span>Settings</span></button>'
      + '        <button class="cafm-app-account-about"><span>About</span></button>'
      + '        <button class="cafm-app-account-logout"><span>Logout</span></button>'
      + '      </div>'
      + '    </div>'
      + '    <nav>'
      + navItem("Home", "/cafm", true, "home", true)
      + navGroup("Maintenance", [["Requests", "/app/issue"], ["Work orders", "/app/facility-work-order"], ["Preventive maintenance", "/app/preventive-maintenance-plan"], ["Inspections", "/app/facility-inspection"]], false, "maintenance")
      + navGroup("Assets", [["Assets", "/app/asset"], ["Locations", "/app/facility-location"], ["Categories", "/app/asset-category"]], false, "assets")
      + navGroup("Vendors & SLA", [["Providers", "/app/facility-service-provider"], ["Contracts", "/app/facility-service-contract"], ["Quotations", "/app/facility-vendor-quotation"], ["SLA policies", "/app/facility-sla-policy"]], false, "vendors")
      + navGroup("Utilities", [["Meters", "/app/utility-meter"], ["Readings", "/app/utility-reading"], ["Bills", "/app/utility-bill"], ["Budgets", "/app/utility-budget"]], false, "utilities")
      + navItem("Analytics", "/dashboard", false, "analytics", true)
      + '    </nav>'
      + '    <a class="cafm-app-workspace-link" href="/app/Workspaces/Facilities">Open Facilities Workspace</a>'
      + '    <button class="cafm-app-collapse" type="button"><span class="cafm-app-collapse-icon"></span><span>Collapse</span></button>'
      + '  </aside>'
      + '  <main class="cafm-app-main">'
      + '    <header class="cafm-app-header"><div><p>FACILITIES OPERATIONS</p><h1>Good day, ' + esc(name.split(" ")[0] || "there") + '</h1><span>Here is the current maintenance picture.</span></div><div class="cafm-app-header-actions"><button class="cafm-app-refresh" title="Refresh"><span>&#8635;</span><em>Refresh</em></button></div></header>'
      + '    <section class="cafm-app-stats">' + stats.map(card => ''
      + '      <button class="cafm-app-stat ' + esc(card.tone) + '" data-route="' + esc(card.route) + '"><small>' + esc(card.label) + '</small><strong>' + esc(card.value) + '</strong><span>' + esc(card.detail) + '</span></button>'
      + '    ').join("") + '</section>'
      + '    <section class="cafm-home-actions"><div><p>QUICK ACTIONS</p><h2>Start something</h2></div><div>' + (quickActions.length ? quickActions.map(action => '<button data-create-doctype="' + esc(action.doctype) + '">+ ' + esc(action.label) + '</button>').join("") : '<span>No create actions available for your role.</span>') + '</div></section>'
      + '    <section class="cafm-home-grid">'
      + '      <article class="cafm-app-panel"><header><div><p>NEEDS ATTENTION</p><h2>Act on these first</h2></div><button class="cafm-app-text-link" data-route="/app/issue">View requests</button></header><div class="cafm-home-list">' + operationalRows(attention, "Nothing urgent", "Critical, overdue, and breached work will appear here.") + '</div></article>'
      + '      <article class="cafm-app-panel"><header><div><p>TODAY</p><h2>Scheduled for today</h2></div></header><div class="cafm-home-list">' + operationalRows(todayItems, "Nothing scheduled today", "Today's work orders, inspections, and preventive tasks will appear here.") + '</div></article>'
      + '    </section>'
      + '    <section class="cafm-app-panel cafm-home-active"><header><div><p>ACTIVE WORK</p><h2>Current work orders</h2></div><button class="cafm-app-text-link" data-route="/app/facility-work-order">View all work orders</button></header>'
      + '      <div class="cafm-app-work-list">' + (orders.length ? orders.map(order => ''
      + '        <button class="cafm-app-work-row" data-preview-doctype="Facility Work Order" data-preview-name="' + esc(order.name) + '" data-route="/app/facility-work-order/' + esc(order.name) + '">'
      + '          <span class="cafm-app-priority ' + esc(String(order.priority || "").toLowerCase()) + '">' + esc(order.priority || "Not set") + '</span>'
      + '          <div><strong>' + esc(order.subject || order.name) + '</strong><small>' + esc(order.facility_location || "No location set") + ' - due ' + esc(order.planned_end || "Not scheduled") + '</small></div>'
      + '          <em>' + esc(order.work_order_status) + '</em><b>></b>'
      + '        </button>'
      + '      ').join("") : '<div class="cafm-app-empty"><strong>No active work orders</strong><span>New and assigned work will appear here.</span></div>') + '</div>'
      + '    </section>'
      + '  </main>'
      + '</div>';
    root.querySelectorAll("[data-route]").forEach(button => button.onclick = () => route(button.dataset.route));
    root.querySelectorAll("[data-preview-doctype][data-preview-name]").forEach(button => button.onclick = event => {
      if (!button.dataset.previewDoctype || !button.dataset.previewName) return;
      event.preventDefault();
      window.cafmOpenRecordPreview(button.dataset.previewDoctype, button.dataset.previewName);
    });
    root.querySelectorAll("[data-create-doctype]").forEach(button => button.onclick = () => window.cafmOpenCreateDrawer(button.dataset.createDoctype));
    root.querySelector(".cafm-app-refresh").onclick = load;
    const shell = root.querySelector(".cafm-app-shell");
    const collapseButton = root.querySelector(".cafm-app-collapse");
    const accountWrap = root.querySelector(".cafm-app-account-wrap");
    const accountButton = root.querySelector(".cafm-app-account-button");
    const accountMenu = root.querySelector(".cafm-app-account-menu");
    let accountOpenedFromCollapsed = false;

    const setSidebarCollapsed = collapsed => {
      shell.classList.toggle("is-collapsed", collapsed);
      collapseButton.querySelector("span:not(.cafm-app-collapse-icon)").textContent = collapsed ? "Expand" : "Collapse";
      collapseButton.querySelector(".cafm-app-collapse-icon").innerHTML = icon(collapsed ? "right" : "left");
      collapseButton.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
      localStorage.setItem("cafm-sidebar-collapsed", collapsed ? "1" : "0");
    };
    const openAccountMenu = () => {
      accountMenu.hidden = false;
      accountMenu.classList.add("is-opening");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        accountMenu.classList.remove("is-opening");
      }));
    };
    const closeAccountMenu = () => {
      if (accountMenu.hidden) return;
      accountMenu.hidden = true;
      accountButton.setAttribute("aria-expanded", "false");
      if (accountOpenedFromCollapsed) {
        accountOpenedFromCollapsed = false;
        setSidebarCollapsed(true);
      }
    };

    setSidebarCollapsed(localStorage.getItem("cafm-sidebar-collapsed") === "1");
    accountButton.onclick = () => {
      if (shell.classList.contains("is-collapsed")) {
        accountOpenedFromCollapsed = true;
        setSidebarCollapsed(false);
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
        return;
      }
      if (accountMenu.hidden) {
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
      } else {
        closeAccountMenu();
      }
    };
    root.addEventListener("click", event => {
      if (!accountWrap.contains(event.target)) closeAccountMenu();
    });
    root.querySelector(".cafm-app-account-about").onclick = () => frappe.msgprint({
      title: "CAFM Operations",
      message: "Your facilities workspace for maintenance, assets, vendors, SLA, and utilities.",
      indicator: "blue"
    });
    root.querySelector(".cafm-app-account-logout").onclick = () => frappe.call({
      method: "logout",
      callback: response => { if (!response.exc) route("/login?redirect-to=" + encodeURIComponent(window.location.pathname + window.location.search)); }
    });


    collapseButton.onclick = () => {
      accountOpenedFromCollapsed = false;
      setSidebarCollapsed(!shell.classList.contains("is-collapsed"));
    };
    root.querySelectorAll(".cafm-app-nav-group summary").forEach(summary => {
      summary.onclick = event => {
        if (shell.classList.contains("is-collapsed")) {
          event.preventDefault();
          setSidebarCollapsed(false);
          summary.parentElement.open = true;
        }
      };
    });
  }

  function load() {
    root.innerHTML = '<div class="cafm-app-loading">Loading CAFM Operations...</div>';
    frappe.call({
      method: "cafm.api.get_cafm_operations_dashboard",
      callback: response => render(response.message || {}),
      error: error => {
        const message = error && error.message ? error.message : "You do not have access to this view.";
        root.innerHTML = '<div class="cafm-app-error"><h2>CAFM Operations</h2><p>' + esc(message) + '</p><a href="/app">Return to Desk</a></div>';
      }
    });
  }
  load();
});
</script>

<script>
frappe.ready(function(){
 const root=document.getElementById("cafm-app-view"); if(!root) return;
 const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

 const ANALYTICS_COLORS={blue:'#4463F0',green:'#29CD42',amber:'#F59E0B',red:'#E53935',softRed:'#cc6a6a',cyan:'#22B8CF',orange:'#E65100',mediumBlue:'#3B82F6',lowGreen:'#22C55E',critical:'#DC2626',gray:'#64748B',gold:'#ffc300'};
 const UTILITY_COLORS=['#2E86DE','#22B8CF','#F59E0B','#E65100','#64748B'];
 const FACILITY_CARD_COLORS=['#4463F0','#4463F0','#cc6a6a','#F59E0B'];
 const UTILITY_CARD_COLORS=['#2E86DE','#F59E0B','#E53935','#F59E0B','#35B779','#2E86DE','#22B8CF','#F59E0B','#E65100'];
 const SLA_CARD_COLORS=['#35B779','#F59E0B','#E53935','#2E86DE'];
 const PRIORITY_MAP={critical:ANALYTICS_COLORS.critical,high:ANALYTICS_COLORS.amber,medium:ANALYTICS_COLORS.mediumBlue,low:ANALYTICS_COLORS.lowGreen};
 const STATUS_MAP={draft:'#94A3B8',assigned:'#3B82F6','in progress':'#F59E0B',pending:'#E65100',resolved:'#29CD42',closed:'#35B779',cancelled:'#64748B'};
 const SLA_MAP={'on track':'#35B779','response breached':'#F59E0B','resolution breached':'#E53935',met:'#2E86DE'};
 const PRIORITY_ORDER=['critical','high','medium','low'];
 const ASSET_PALETTE=['#4463F0','#22B8CF','#F59E0B','#E65100','#35B779'];

 function paletteFor(rows,map){return (rows||[]).map(row=>map[String(row.label||"").toLowerCase()]||ANALYTICS_COLORS.gray);}
 function orderedPriorities(rows){return [...(rows||[])].sort((a,b)=>{const ai=PRIORITY_ORDER.indexOf(String(a.label||"").toLowerCase());const bi=PRIORITY_ORDER.indexOf(String(b.label||"").toLowerCase());return (ai<0?99:ai)-(bi<0?99:bi);});}
 function pairs(source){const labels=(source&&source.labels)||[];const values=(source&&source.datasets&&source.datasets[0]&&source.datasets[0].values)||[];return labels.map((label,i)=>({label,value:values[i]||0}));}

 function numberCard(label,value,color){
  return '<div class="cafm-kpi" style="--kpi-color:'+esc(color)+'"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></div>';
 }

 // ---- real arc geometry (replaces the old dasharray/rotation approximation) ----
 function polarToCartesian(cx,cy,r,angleDeg){
  const rad=(angleDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
 }
 function describeArc(cx,cy,r,startAngle,endAngle){
  const start=polarToCartesian(cx,cy,r,endAngle);
  const end=polarToCartesian(cx,cy,r,startAngle);
  const largeArcFlag=endAngle-startAngle<=180?"0":"1";
  return ["M",start.x,start.y,"A",r,r,0,largeArcFlag,0,end.x,end.y].join(" ");
 }

 function donutChart(rows,colors,opts){
  opts=opts||{}; rows=rows||[];
  const total=rows.reduce((sum,r)=>sum+(Number(r.value)||0),0)||1;
  const isHalf=opts.variant==="half";
  const cx=110,cy=isHalf?105:110,r=78,stroke=24;
  const sweep=isHalf?180:360;
  const baseAngle=isHalf?-90:0;
  let acc=0;
  const arcs=rows.map((row,i)=>{
   const frac=(Number(row.value)||0)/total;
   const startAngle=baseAngle+acc*sweep;
   acc+=frac;
   const endAngle=baseAngle+acc*sweep;
   if(frac<=0) return "";
   const clampedEnd=Math.min(endAngle,baseAngle+sweep-0.001);
   const mid=(startAngle+clampedEnd)/2;
   const labelPos=polarToCartesian(cx,cy,r,mid);
   const inline=(opts.showInlineLabels&&frac>0.06)?'<text x="'+labelPos.x+'" y="'+labelPos.y+'" text-anchor="middle" dominant-baseline="middle" class="cafm-donut-inline">'+Math.round(frac*100)+'%</text>':'';
   return '<path d="'+describeArc(cx,cy,r,startAngle,clampedEnd)+'" fill="none" stroke="'+esc(colors[i])+'" stroke-width="'+stroke+'" stroke-linecap="butt"/>'+inline;
  }).join("");
  const viewHeight=isHalf?140:220;
  const centerLabel=opts.centerLabel?'<text x="'+cx+'" y="'+(isHalf?cy-4:cy)+'" text-anchor="middle" class="cafm-donut-center-num">'+esc(String(total))+'</text><text x="'+cx+'" y="'+(isHalf?cy+14:cy+18)+'" text-anchor="middle" class="cafm-donut-center-label">'+esc(opts.centerLabel)+'</text>':'';
  const legend=rows.map((row,i)=>'<div class="legend-item"><span class="legend-dot" style="background-color:'+esc(colors[i])+'"></span><span>'+esc(row.label)+'</span><strong>'+esc(row.value)+'</strong></div>').join("");
  return '<section class="cafm-chart custom-legend">'
   +'<div class="cafm-chart-head"><h3>'+esc(opts.title||"")+'</h3>'+(opts.subtitle?'<p>'+esc(opts.subtitle)+'</p>':'')+'</div>'
   +'<div class="cafm-donut-body"><svg viewBox="0 0 220 '+viewHeight+'" class="cafm-donut-svg">'+arcs+centerLabel+'</svg></div>'
   +'<div class="ordered-legend">'+legend+'</div>'
   +'</section>';
 }

 function barChart(rows,color,opts){
  opts=opts||{}; rows=rows||[];
  const max=Math.max(1,...rows.map(r=>Number(r.value)||0));
  const head='<div class="cafm-chart-head"><h3>'+esc(opts.title||"")+'</h3>'+(opts.subtitle?'<p>'+esc(opts.subtitle)+'</p>':'')+'</div>';
  if(opts.horizontal){
   const body=rows.map(row=>'<div class="cafm-hbar-row"><span class="cafm-hbar-label">'+esc(row.label)+'</span><i><b style="width:'+((Number(row.value)||0)/max*100)+'%;background:'+esc(color)+'"></b></i><em>'+esc(row.value)+'</em></div>').join("");
   return '<section class="cafm-chart">'+head+'<div class="cafm-hbar-list">'+body+'</div></section>';
  }
  const body=rows.map(row=>'<div class="cafm-vbar-col"><em>'+esc(row.value)+(opts.unit?' '+esc(opts.unit):'')+'</em><div class="cafm-vbar-track"><div class="cafm-vbar-fill" style="height:'+((Number(row.value)||0)/max*100)+'%;background:'+esc(color)+'"></div></div><span>'+esc(row.label)+'</span></div>').join("");
  return '<section class="cafm-chart">'+head+'<div class="cafm-vbar-list">'+body+'</div></section>';
 }

 function seriesBarChart(source,colors,opts){
  opts=opts||{};
  const labels=(source&&source.labels)||[];
  const datasets=(source&&source.datasets)||[];
  const max=Math.max(1,...datasets.flatMap(d=>d.values||[]));
  const groups=labels.map((label,i)=>{
   const bars=datasets.map((d,di)=>'<b style="height:'+(((d.values&&d.values[i])||0)/max*100)+'%;background:'+esc(colors[di%colors.length])+'" title="'+esc(d.name||"")+': '+esc((d.values&&d.values[i])||0)+'"></b>').join("");
   return '<div class="cafm-series-group"><div class="cafm-series-bars">'+bars+'</div><span>'+esc(label)+'</span></div>';
  }).join("");
  const legend=datasets.map((d,i)=>'<div class="legend-item"><span class="legend-dot" style="background-color:'+esc(colors[i%colors.length])+'"></span><span>'+esc(d.name||"")+'</span></div>').join("");
  return '<section class="cafm-chart cafm-chart-wide custom-legend">'
   +'<div class="cafm-chart-head"><h3>'+esc(opts.title||"")+'</h3>'+(opts.subtitle?'<p>'+esc(opts.subtitle)+'</p>':'')+'</div>'
   +'<div class="cafm-series-body"><div class="cafm-series-list">'+groups+'</div></div>'
   +'<div class="ordered-legend">'+legend+'</div>'
   +'</section>';
 }

 // ---- real line chart: solid "actual" + dashed "forecast", with a utility selector like the Vue component ----
 function actualForecastChart(seriesList,colors,opts){
  opts=opts||{}; seriesList=seriesList||[];
  const stateKey="__afSelected";
  function panel(index){
   const series=seriesList[index]||{labels:[],actual:[],forecast:[],unit:"Usage",utility_type:""};
   const color=colors[index%colors.length]||"#2E86DE";
   const labels=series.labels||[];
   const actual=series.actual||[];
   const forecast=series.forecast||[];
   const values=[...actual,...forecast].filter(v=>v!=null);
   const max=Math.max(1,...values);
   const min=Math.min(0,...values);
   const w=680,h=200,padL=8,padR=8,padT=10,padB=26;
   const stepX=labels.length>1?(w-padL-padR)/(labels.length-1):0;
   const y=v=>h-padB-((v-min)/(max-min||1))*(h-padT-padB);
   const x=i=>padL+i*stepX;
   const linePoints=arr=>arr.map((v,i)=>v==null?null:x(i)+","+y(v)).filter(Boolean).join(" ");
   const dots=(arr,cls)=>arr.map((v,i)=>v==null?"":'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" class="'+cls+'" style="fill:'+color+'"/>').join("");
   const labelsRow=labels.map((label,i)=>'<text x="'+x(i)+'" y="'+(h-6)+'" text-anchor="middle" class="cafm-line-axis-label">'+esc(String(label).slice(5))+'</text>').join("");
   return '<svg viewBox="0 0 '+w+' '+h+'" class="cafm-line-svg">'
    +'<polyline points="'+linePoints(actual)+'" fill="none" stroke="'+color+'" stroke-width="2.5" class="cafm-line-actual"/>'
    +'<polyline points="'+linePoints(forecast)+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-dasharray="6 5" class="cafm-line-forecast"/>'
    +dots(actual,"cafm-line-dot-actual")+dots(forecast,"cafm-line-dot-forecast")
    +labelsRow+'</svg>'
    +'<div class="cafm-af-legend"><span><i class="solid" style="background:'+color+'"></i>Actual '+esc(series.utility_type||"")+'</span><span><i class="dashed" style="border-color:'+color+'"></i>Forecast</span><span class="cafm-af-unit">'+esc(series.unit||"")+'</span></div>';
  }
  const options=seriesList.map((s,i)=>'<option value="'+i+'">'+esc(s.utility_type||"")+' ('+esc(s.unit||"")+')</option>').join("");
  const uid="af"+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{
   const wrap=document.getElementById(uid); if(!wrap) return;
   const select=wrap.querySelector("select");
   const body=wrap.querySelector(".cafm-af-body");
   select.onchange=()=>{ body.innerHTML=panel(Number(select.value)); };
  });
  return '<section class="cafm-chart cafm-chart-wide" id="'+uid+'">'
   +'<div class="cafm-chart-head cafm-chart-head-row"><div><h3>'+esc(opts.title||"")+'</h3>'+(opts.subtitle?'<p>'+esc(opts.subtitle)+'</p>':'')+'</div>'
   +'<label class="series-picker"><span>Utility</span><select>'+options+'</select></label></div>'
   +'<div class="cafm-af-body">'+panel(0)+'</div>'
   +'</section>';
 }

 // ---- 100%-stacked bar per quarter, top assets as series (matches BarChart stacked="normalized") ----
 function recurringFailuresChart(mix){
  mix=mix||[];
  const quarters=[...new Set(mix.map(r=>r.quarter))];
  const totalsByAsset={};
  mix.forEach(r=>{ totalsByAsset[r.asset]=(totalsByAsset[r.asset]||0)+(r.failures||0); });
  const topAssets=Object.keys(totalsByAsset).sort((a,b)=>totalsByAsset[b]-totalsByAsset[a]).slice(0,5);
  const colorFor=asset=>ASSET_PALETTE[topAssets.indexOf(asset)%ASSET_PALETTE.length];

  const cols=quarters.map(quarter=>{
   const rows=topAssets.map(asset=>{
    const match=mix.find(r=>r.quarter===quarter&&r.asset===asset);
    return {asset,value:match?match.failures:0};
   });
   const total=rows.reduce((s,r)=>s+r.value,0)||1;
   const segments=rows.map(r=>'<div class="cafm-stack-seg" style="height:'+(r.value/total*100)+'%;background:'+colorFor(r.asset)+'" title="'+esc(r.asset)+': '+r.value+'"></div>').join("");
   return '<div class="cafm-stack-col"><div class="cafm-stack-track">'+segments+'</div><span>'+esc(quarter)+'</span></div>';
  }).join("");

  const legend=topAssets.map(asset=>'<div class="legend-item"><span class="legend-dot" style="background-color:'+colorFor(asset)+'"></span><span>'+esc(asset)+'</span></div>').join("");
  return '<section class="cafm-chart cafm-chart-wide custom-legend">'
   +'<div class="cafm-chart-head"><h3>Top recurring asset failures</h3><p>Quarterly share of maintenance-history events by asset</p></div>'
   +'<div class="cafm-stack-body">'+cols+'</div>'
   +'<div class="ordered-legend">'+legend+'</div>'
   +'</section>';
 }

 function renderFacility(data){
  const stats=(data.stats||[]).map((s,i)=>numberCard(s.label,s.value,FACILITY_CARD_COLORS[i])).join("");
  const priorityRows=orderedPriorities(data.work_orders_by_priority);
  const priorityColors=priorityRows.map(r=>PRIORITY_MAP[String(r.label||"").toLowerCase()]||ANALYTICS_COLORS.gray);
  return '<section class="cafm-kpi-grid">'+stats+'</section>'
   +'<section class="cafm-chart-grid">'
   +donutChart(priorityRows,priorityColors,{variant:"half",showInlineLabels:true,title:"Work orders by priority",subtitle:"Current work-order distribution"})
   +donutChart(data.work_orders_by_status,paletteFor(data.work_orders_by_status,STATUS_MAP),{title:"Work orders by status",subtitle:"Current lifecycle position",centerLabel:"work orders"})
   +barChart(data.work_orders_by_category,ANALYTICS_COLORS.gold,{horizontal:true,title:"Work orders by category",subtitle:"Most active maintenance categories"})
   +barChart(data.asset_downtime,ANALYTICS_COLORS.blue,{unit:"Hours",title:"Asset downtime",subtitle:"Recorded downtime by asset"})
   +recurringFailuresChart(data.recurring_asset_failure_mix)
   +'</section>';
 }

 function renderUtility(data){
  const cards=(data.cards||[]).map((c,i)=>numberCard(c.label,c.value,UTILITY_CARD_COLORS[i])).join("");
  return '<section class="cafm-kpi-grid cafm-kpi-grid-wide">'+cards+'</section>'
   +'<section class="cafm-chart-grid">'
   +seriesBarChart(data.monthly_cost,UTILITY_COLORS,{title:"Monthly utility cost",subtitle:"Cost by utility type"})
   +actualForecastChart(data.usage_forecast,UTILITY_COLORS,{title:"Actual vs Forecast Utility Consumption",subtitle:"Recorded monthly consumption compared with the rolling forecast"})
   +'</section>';
 }

 function renderSla(data){
  const rows=pairs(data.status_breakdown);
  const colors=rows.map(r=>SLA_MAP[String(r.label||"").toLowerCase()]||ANALYTICS_COLORS.gray);
  const cards=(data.cards||[]).map((c,i)=>numberCard(c.label,c.value,SLA_CARD_COLORS[i])).join("");
  return '<section class="cafm-kpi-grid">'+cards+'</section>'
   +'<section class="cafm-chart-grid cafm-chart-grid-single">'
   +donutChart(rows,colors,{variant:"half",showInlineLabels:true,title:"Work orders by SLA status",subtitle:"Current SLA performance"})
   +'</section>';
 }

 const ANALYTICS_VIEWS={
  facility:{label:"Facility Management",method:"get_facility_management_analytics",render:renderFacility},
  utility:{label:"Utility Consumption",method:"get_utility_consumption_analytics",render:renderUtility},
  sla:{label:"SLA Performance",method:"get_sla_performance_analytics",render:renderSla}
 };

 function showAnalytics(){
  const main=root.querySelector(".cafm-app-main");
  if(!main){ setTimeout(showAnalytics,100); return; }

  root.querySelectorAll(".cafm-app-nav-item").forEach(item=>{
   item.classList.toggle("active",item.dataset.route==="/dashboard");
  });
  main.classList.add("cafm-app-main-analytics");
  main.innerHTML='<div class="cafm-dashboard-embed">'
   +'<div class="cafm-dashboard-embed-loading">Loading analytics...</div>'
   +'<iframe src="/dashboard" title="CAFM analytics dashboard"></iframe>'
   +'</div>';

  const frame=main.querySelector("iframe");
  frame.addEventListener("load",()=>{
   main.querySelector(".cafm-dashboard-embed-loading")?.remove();
   frame.classList.add("is-ready");
  });
  history.replaceState({},"","/cafm?section=analytics");
 }

 root.addEventListener("click",e=>{
  const item=e.target.closest('[data-route="/dashboard"]');
  if(item){e.preventDefault();e.stopImmediatePropagation();showAnalytics();}
 },true);
 if(new URLSearchParams(location.search).get("section")==="analytics"){
  showAnalytics();
 }
});
</script>

<script>
frappe.ready(function(){
 const root=document.getElementById("cafm-app-view"); if(!root) return;
 const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const badgeTheme=(value,fieldname)=>{const text=String(value??"").toLowerCase();if(/critical|breach|overdue|rejected|cancelled|expired|failed/.test(text))return "red";if(/high|in progress|pending|due soon/.test(text))return "amber";if(/resolved|closed|completed|met|on track|approved|matched/.test(text))return "green";if(/low/.test(text))return "teal";if(/medium|assigned|new|draft|open/.test(text))return "blue";if(/type/.test(String(fieldname||"").toLowerCase()))return "violet";return "gray";};
 const badge=(value,fieldname)=>{const text=value===null||value===undefined||value===""?"Not set":String(value);const checked=/resolved|closed|completed|met|on track|approved|matched/.test(text.toLowerCase());return '<span class="cafm-subtle-badge '+badgeTheme(text,fieldname)+'">'+(checked?'<span class="cafm-subtle-badge-icon" aria-hidden="true">&#10003;</span>':'')+'<span>'+esc(text)+'</span></span>';};
 const requestDate=value=>value&&frappe.datetime?frappe.datetime.str_to_user(value):value||"-";
 function closeRequestPreview(){const preview=root.querySelector(".cafm-record-preview");if(!preview||preview.classList.contains("is-closing"))return;preview.classList.add("is-closing");setTimeout(()=>preview.remove(),180);}
 function showRequestPreview(name){
  closeRequestPreview();
  root.insertAdjacentHTML("beforeend",'<div class="cafm-record-preview" role="dialog" aria-modal="true" aria-label="Maintenance request details"><button class="cafm-record-preview-backdrop" data-preview-close aria-label="Close"></button><section class="cafm-record-preview-panel"><div class="cafm-record-preview-loading">Loading request...</div></section></div>');
  const preview=root.querySelector(".cafm-record-preview");
  preview.querySelector("[data-preview-close]").onclick=closeRequestPreview;
  frappe.call({method:"cafm.api.get_cafm_request_detail",args:{name},callback:response=>{
   const item=response.message||{};
   const value=(label,content)=>'<div class="cafm-record-preview-field"><small>'+esc(label)+'</small><strong>'+esc(content||"-")+'</strong></div>';
   const linked=item.work_order?'<button class="cafm-record-preview-related" data-open-work-order="'+esc(item.work_order)+'"><span>Linked work order</span><strong>'+esc(item.work_order)+'</strong><b>&gt;</b></button>':'';
   preview.querySelector(".cafm-record-preview-panel").innerHTML='<header><div><p>MAINTENANCE REQUEST</p><h2>'+esc(item.subject||item.name)+'</h2><span>'+esc(item.name)+'</span></div><button type="button" data-preview-close aria-label="Close">&times;</button></header>'
    +'<div class="cafm-record-preview-badges">'+badge(item.priority,"priority")+badge(item.status,"status")+badge(item.category,"type")+'</div>'
    +'<div class="cafm-record-preview-grid">'+value("Facility location",item.facility_location)+value("Asset",item.asset)+value("Company",item.company)+value("Raised by",item.raised_by)+value("Created",requestDate(item.creation))+value("Last updated",requestDate(item.modified))+'</div>'
    +'<section class="cafm-record-preview-description"><small>DESCRIPTION</small><p>'+esc(item.description||"No description provided.")+'</p></section>'
    +linked
    +'<footer><button type="button" class="cafm-record-preview-secondary" data-preview-close>Close</button><button type="button" class="cafm-record-preview-primary" data-open-request="'+esc(item.name)+'">Open full record</button></footer>';
   preview.querySelectorAll("[data-preview-close]").forEach(button=>button.onclick=closeRequestPreview);
   preview.querySelector("[data-open-request]").onclick=()=>window.location.href="/app/issue/"+encodeURIComponent(item.name);
   const workOrder=preview.querySelector("[data-open-work-order]");if(workOrder)workOrder.onclick=()=>window.location.href="/app/facility-work-order/"+encodeURIComponent(workOrder.dataset.openWorkOrder);
  },error:()=>{preview.querySelector(".cafm-record-preview-panel").innerHTML='<div class="cafm-record-preview-error"><h2>Could not load request</h2><p>You may not have permission to view this record.</p><button data-preview-close>Close</button></div>';preview.querySelector("[data-preview-close]").onclick=closeRequestPreview;}});
 }
 function showRequests(){
  root.querySelectorAll(".cafm-app-nav-item").forEach(item=>item.classList.toggle("active",item.dataset.route==="/app/issue"));
  const requestMain=root.querySelector(".cafm-app-main");if(!requestMain)return;
  requestMain.classList.remove("cafm-app-main-analytics");
  requestMain.innerHTML='<div class="cafm-app-loading">Loading maintenance requests...</div>';
  frappe.call({method:"cafm.api.get_cafm_maintenance_requests",callback:r=>{
   const data=r.message||{}, rows=data.requests||[];
   const statusCount={New:0,"In Progress":0,Resolved:0,Other:0};
   const priorityCount={Critical:0,High:0,Medium:0,Low:0};
   rows.forEach(x=>{const status=x.custom_issue_status||"New";if(statusCount[status]!==undefined)statusCount[status]++;else statusCount.Other++;const priority=x.priority||"Low";if(priorityCount[priority]!==undefined)priorityCount[priority]++;});
   const table=rows.map(x=>'<tr data-search="'+esc((x.name+" "+(x.subject||"")).toLowerCase())+'"><td><button class="cafm-record-link" data-request-id="'+esc(x.name)+'">'+esc(x.name)+'</button></td><td><button class="cafm-record-link" data-request-id="'+esc(x.name)+'">'+esc(x.subject||x.name)+'</button></td><td>'+badge(x.priority||"Not set","priority")+'</td><td>'+badge(x.custom_issue_status||"New","status")+'</td><td>'+esc(x.custom_facility_location||"-")+'</td><td>'+badge(x.issue_type||"Not set","type")+'</td><td>'+esc(frappe.datetime.str_to_user(x.modified))+'</td></tr>').join("");
   const cards=rows.map(x=>'<button class="cafm-request-card" data-search="'+esc((x.name+" "+(x.subject||"")).toLowerCase())+'" data-request-id="'+esc(x.name)+'"><small>'+esc(x.name)+'</small><strong>'+esc(x.subject||x.name)+'</strong><span class="cafm-request-card-badges">'+badge(x.priority||"Not set","priority")+badge(x.custom_issue_status||"New","status")+'</span></button>').join("");
   const dashboard='<section class="cafm-request-dashboard"><div class="cafm-request-metric"><small>OPEN REQUESTS</small><strong>'+((statusCount.New||0)+(statusCount["In Progress"]||0))+'</strong><span>New or in progress</span></div><div class="cafm-request-metric"><small>RESOLVED</small><strong>'+statusCount.Resolved+'</strong><span>Completed requests</span></div><div class="cafm-request-metric"><small>HIGH PRIORITY</small><strong>'+((priorityCount.High||0)+(priorityCount.Critical||0))+'</strong><span>High and critical</span></div><div class="cafm-request-chart"><h3>Requests by status</h3>'+Object.keys(statusCount).map(k=>'<div class="cafm-request-bar"><span>'+esc(k)+'</span><i><b style="width:'+((statusCount[k]/Math.max(rows.length,1))*100)+'%"></b></i><em>'+statusCount[k]+'</em></div>').join("")+'</div><div class="cafm-request-chart"><h3>Requests by priority</h3>'+Object.keys(priorityCount).map(k=>'<div class="cafm-request-bar"><span>'+esc(k)+'</span><i><b class="priority-bar '+esc(k.toLowerCase())+'" style="width:'+((priorityCount[k]/Math.max(rows.length,1))*100)+'%"></b></i><em>'+priorityCount[k]+'</em></div>').join("")+'</div></section>';
   const board='<section class="cafm-request-board">'+["New","In Progress","Resolved","Other"].map(k=>'<div class="cafm-request-lane"><header><strong>'+esc(k)+'</strong><span>'+statusCount[k]+'</span></header>'+rows.filter(x=>{const v=x.custom_issue_status||"New";return (statusCount[v]!==undefined?v:"Other")===k;}).map(x=>'<button type="button" data-request-id="'+esc(x.name)+'"><small>'+esc(x.name)+'</small><b>'+esc(x.subject||x.name)+'</b><span class="cafm-request-card-badges">'+badge(x.priority||"Not set","priority")+'</span></button>').join("")+'</div>').join("")+'</section>';
   const main=root.querySelector(".cafm-app-main"); if(!main) return;
   main.classList.remove("cafm-app-main-analytics");
   main.innerHTML='<header class="cafm-app-header"><div><p>MAINTENANCE</p><h1>Maintenance requests</h1><span>Search, review, and create facility requests.</span></div><div class="cafm-request-actions"><button class="cafm-app-refresh" type="button" data-request-refresh><span>&#8635;</span><em>Refresh</em></button>'+(data.can_create?'<button class="cafm-request-create" data-request-create>+ Create request</button>':'')+'</div></header><section class="cafm-request-toolbar"><input type="search" data-request-search placeholder="Search by subject or ID"><div class="cafm-request-view-menu"><span>View</span><button type="button" data-request-view-button aria-expanded="false">Table <b>&#8964;</b></button><div class="cafm-view-options" data-request-view-options hidden><button type="button" data-request-mode="table">Table</button><button type="button" data-request-mode="dashboard">Dashboard</button><button type="button" data-request-mode="kanban">Kanban</button></div></div><span>'+rows.length+' requests</span></section>'+dashboard+board+'<section class="cafm-request-list" data-request-list><div class="cafm-request-table-wrap"><table><thead><tr><th>ID</th><th>Subject</th><th>Priority</th><th>Status</th><th>Location</th><th>Category</th><th>Last updated</th></tr></thead><tbody>'+table+'</tbody></table></div><div class="cafm-request-cards">'+cards+'</div></section>';

   main.querySelectorAll("[data-request-id]").forEach(button=>button.onclick=event=>{event.preventDefault();showRequestPreview(button.dataset.requestId);});
   const create=main.querySelector("[data-request-create]"); if(create) create.onclick=()=>window.cafmOpenCreateDrawer("Issue");
   main.querySelector("[data-request-search]").oninput=e=>{const q=e.target.value.toLowerCase();main.querySelectorAll("[data-search]").forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?"":"none")};
   const viewButton=main.querySelector("[data-request-view-button]");const viewOptions=main.querySelector("[data-request-view-options]");const applyView=mode=>{const list=main.querySelector("[data-request-list]");list.classList.remove("cards");main.querySelector(".cafm-request-dashboard").classList.toggle("visible",mode==="dashboard");main.querySelector(".cafm-request-board").classList.toggle("visible",mode==="kanban");list.style.display=(mode==="dashboard"||mode==="kanban")?"none":"";viewButton.firstChild.nodeValue={table:"Table",dashboard:"Dashboard",kanban:"Kanban"}[mode]+" ";viewOptions.hidden=true;viewButton.setAttribute("aria-expanded","false");};viewButton.onclick=()=>{viewOptions.style.width=viewButton.offsetWidth+"px";const open=viewOptions.hidden;viewOptions.hidden=!open;viewButton.setAttribute("aria-expanded",open?"true":"false");};viewOptions.querySelectorAll("[data-request-mode]").forEach(button=>button.onclick=()=>applyView(button.dataset.requestMode));
  },error:()=>{requestMain.innerHTML='<div class="cafm-app-error"><h2>Could not load maintenance requests</h2><p>Please try again.</p><button type="button" class="cafm-app-refresh" data-request-refresh><span>&#8635;</span><em>Retry</em></button></div>';}});
 }
 root.addEventListener("click",e=>{const refresh=e.target.closest('[data-request-refresh]');if(refresh){e.preventDefault();e.stopImmediatePropagation();showRequests();return;}const item=e.target.closest('[data-route="/app/issue"]');if(item){e.preventDefault();e.stopImmediatePropagation();showRequests();}},true);
});
</script>

<script>
frappe.ready(function(){
 const root=document.getElementById("cafm-app-view"); if(!root) return;
 const esc=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const badgeTheme=(value,fieldname)=>{const text=String(value??"").toLowerCase();const field=String(fieldname||"").toLowerCase();if(/frequency/.test(field)){if(/daily/.test(text))return "red";if(/weekly/.test(text))return "amber";if(/monthly/.test(text))return "blue";if(/quarterly|biannual|semi-annual/.test(text))return "violet";if(/yearly|annual/.test(text))return "green";return "teal";}if(/critical|breach|overdue|rejected|cancelled|expired|failed/.test(text))return "red";if(/high|in progress|pending|due soon/.test(text))return "amber";if(/resolved|closed|completed|met|on track|approved|matched/.test(text))return "green";if(/low/.test(text))return "teal";if(/medium|assigned|new|draft|open/.test(text))return "blue";if(/type/.test(String(fieldname||"").toLowerCase()))return "violet";return "gray";};
 const badge=(value,fieldname)=>{const text=value===null||value===undefined||value===""?"Not set":String(value);const checked=/resolved|closed|completed|met|on track|approved|matched/.test(text.toLowerCase());return '<span class="cafm-subtle-badge '+badgeTheme(text,fieldname)+'">'+(checked?'<span class="cafm-subtle-badge-icon" aria-hidden="true">&#10003;</span>':'')+'<span>'+esc(text)+'</span></span>';};
 const isBadgeField=fieldname=>/(priority|status|type|frequency)/.test(String(fieldname||"").toLowerCase());
 const views={
  "/app/facility-work-order":{doctype:"Facility Work Order",label:"Work orders"},
  "/app/preventive-maintenance-plan":{doctype:"Preventive Maintenance Plan",label:"Preventive maintenance"},
  "/app/facility-inspection":{doctype:"Facility Inspection",label:"Inspections"},
  "/app/asset":{doctype:"Asset",label:"Assets"},
  "/app/facility-location":{doctype:"Facility Location",label:"Locations"},
  "/app/asset-category":{doctype:"Asset Category",label:"Asset categories"},
  "/app/facility-service-provider":{doctype:"Facility Service Provider",label:"Service providers"},
  "/app/facility-service-contract":{doctype:"Facility Service Contract",label:"Service contracts"},
  "/app/facility-vendor-quotation":{doctype:"Facility Vendor Quotation",label:"Vendor quotations"},
  "/app/facility-sla-policy":{doctype:"Facility SLA Policy",label:"SLA policies"},
  "/app/utility-meter":{doctype:"Utility Meter",label:"Utility meters"},
  "/app/utility-reading":{doctype:"Utility Reading",label:"Utility readings"},
  "/app/utility-bill":{doctype:"Utility Bill",label:"Utility bills"},
  "/app/utility-budget":{doctype:"Utility Budget",label:"Utility budgets"}
 };

 function showDoctype(route){
  const config=views[route]; if(!config) return;
  const main=root.querySelector(".cafm-app-main");
  if(!main){setTimeout(()=>showDoctype(route),100);return;}
  main.classList.remove("cafm-app-main-analytics");
  root.querySelectorAll(".cafm-app-nav-item").forEach(item=>item.classList.toggle("active",item.dataset.route===route));
  main.innerHTML='<div class="cafm-app-loading">Loading '+esc(config.label.toLowerCase())+'...</div>';

  frappe.call({
   method:"cafm.api.get_cafm_doctype_view",
   args:{doctype:config.doctype},
   callback:response=>renderDoctype(route,config,response.message||{}),
   error:error=>{
    const message=error&&error.message?error.message:"Unable to load records.";
    main.innerHTML='<div class="cafm-app-error"><h2>'+esc(config.label)+'</h2><p>'+esc(message)+'</p></div>';
   }
  });
 }

 function renderDoctype(route,config,data){
  const main=root.querySelector(".cafm-app-main"); if(!main) return;
  const rows=data.rows||[],columns=data.columns||[];
  const groupField=data.group_field;
  const appRoute=route;
  const display=value=>{
   if(value===null||value===undefined||value==="")return "-";
   return String(value);
  };
  const recordUrl=name=>appRoute+"/"+encodeURIComponent(name);
  const searchText=row=>columns.map(column=>display(row[column.fieldname])).join(" ").toLowerCase();

  const header=columns.map(column=>'<th>'+esc(column.label)+'</th>').join("");
  const tableRows=rows.map(row=>'<tr data-record-search="'+esc(searchText(row))+'" data-generic-preview-name="'+esc(row.name)+'">'+columns.map((column,index)=>{
   const text=display(row[column.fieldname]);
   const content=isBadgeField(column.fieldname)?badge(text,column.fieldname):esc(text);
   return '<td>'+(index===0?'<button class="cafm-record-link" type="button">'+esc(text)+'</button>':content)+'</td>';
  }).join("")+'</tr>').join("");

  const groups={};
  rows.forEach(row=>{
   const label=groupField?display(row[groupField]):"All records";
   (groups[label]||(groups[label]=[])).push(row);
  });
  const groupEntries=Object.entries(groups).sort((left,right)=>right[1].length-left[1].length);
  const top=groupEntries[0]||["No group",[]];
  const dashboard='<section class="cafm-request-dashboard">'
   +'<div class="cafm-request-metric"><small>TOTAL RECORDS</small><strong>'+rows.length+'</strong><span>Visible to your account</span></div>'
   +'<div class="cafm-request-metric"><small>GROUPS</small><strong>'+groupEntries.length+'</strong><span>'+(groupField?esc(columns.find(column=>column.fieldname===groupField)?.label||groupField):"All records")+'</span></div>'
   +'<div class="cafm-request-metric"><small>LARGEST GROUP</small><strong>'+top[1].length+'</strong><span>'+esc(top[0])+'</span></div>'
   +'<div class="cafm-request-chart"><h3>'+esc(config.label)+' by '+esc(groupField?(columns.find(column=>column.fieldname===groupField)?.label||groupField):"record group")+'</h3>'
   +groupEntries.map(entry=>'<div class="cafm-request-bar"><span>'+esc(entry[0])+'</span><i><b style="width:'+((entry[1].length/Math.max(rows.length,1))*100)+'%"></b></i><em>'+entry[1].length+'</em></div>').join("")
   +'</div></section>';

  const board='<section class="cafm-request-board">'+groupEntries.map(entry=>'<div class="cafm-request-lane"><header><strong>'+esc(entry[0])+'</strong><span>'+entry[1].length+'</span></header>'
   +entry[1].map(row=>'<button type="button" data-generic-preview-name="'+esc(row.name)+'"><small>'+esc(row.name)+'</small><b>'+esc(row[data.title_field]||row.name)+'</b><span class="cafm-request-card-badges">'+(isBadgeField(groupField)?badge(display(row[groupField]),groupField):'<span>'+esc(config.doctype)+'</span>')+'</span></button>').join("")
   +'</div>').join("")+'</section>';

  main.innerHTML='<header class="cafm-app-header"><div><p>CAFM RECORDS</p><h1>'+esc(config.label)+'</h1><span>Search, review, create, and analyse '+esc(config.label.toLowerCase())+'.</span></div><div class="cafm-request-actions"><button class="cafm-app-refresh" type="button" data-generic-refresh><span>&#8635;</span><em>Refresh</em></button>'+(data.can_create?'<button class="cafm-request-create" data-generic-create>+ Create '+esc(config.doctype)+'</button>':'')+'</div></header>'
   +'<section class="cafm-request-toolbar"><input type="search" data-generic-search placeholder="Search by ID or displayed fields"><div class="cafm-request-view-menu"><span>View</span><button type="button" data-generic-view-button aria-expanded="false">Table <b>&#8964;</b></button><div class="cafm-view-options" data-generic-view-options hidden><button type="button" data-generic-mode="table">Table</button><button type="button" data-generic-mode="dashboard">Dashboard</button><button type="button" data-generic-mode="kanban">Kanban</button></div></div><span>'+rows.length+' records</span></section>'
   +dashboard+board+'<section class="cafm-request-list" data-generic-list><div class="cafm-request-table-wrap"><table><thead><tr>'+header+'</tr></thead><tbody>'+tableRows+'</tbody></table></div></section>';

  main.querySelector("[data-generic-refresh]").onclick=event=>{event.preventDefault();event.stopPropagation();const currentRoute=route;requestAnimationFrame(()=>showDoctype(currentRoute));};
  main.querySelectorAll("[data-generic-preview-name]").forEach(button=>button.onclick=event=>{event.preventDefault();window.cafmOpenRecordPreview(config.doctype,button.dataset.genericPreviewName);});
  const create=main.querySelector("[data-generic-create]"); if(create)create.onclick=()=>window.cafmOpenCreateDrawer(config.doctype);
  main.querySelector("[data-generic-search]").oninput=event=>{
   const query=event.target.value.toLowerCase();
   main.querySelectorAll("[data-record-search]").forEach(element=>element.style.display=!query||element.dataset.recordSearch.includes(query)?"":"none");
  };

  const viewButton=main.querySelector("[data-generic-view-button]");
  const viewOptions=main.querySelector("[data-generic-view-options]");
  const applyView=mode=>{
   main.querySelector(".cafm-request-dashboard").classList.toggle("visible",mode==="dashboard");
   main.querySelector(".cafm-request-board").classList.toggle("visible",mode==="kanban");
   main.querySelector("[data-generic-list]").style.display=mode==="table"?"":"none";
   viewButton.firstChild.nodeValue={table:"Table",dashboard:"Dashboard",kanban:"Kanban"}[mode]+" ";
   viewOptions.hidden=true;
   viewButton.setAttribute("aria-expanded","false");
  };
  viewButton.onclick=()=>{
   viewOptions.style.width=viewButton.offsetWidth+"px";
   const opening=viewOptions.hidden;
   viewOptions.hidden=!opening;
   viewButton.setAttribute("aria-expanded",opening?"true":"false");
  };
  viewOptions.querySelectorAll("[data-generic-mode]").forEach(button=>button.onclick=()=>applyView(button.dataset.genericMode));
  history.replaceState({},"","/cafm?section="+encodeURIComponent(config.doctype));
 }

 root.addEventListener("click",event=>{
  const item=event.target.closest("[data-route]");
  const route=item&&item.dataset.route;
  if(!views[route])return;
  event.preventDefault();
  event.stopImmediatePropagation();
  showDoctype(route);
 },true);

 const requested=new URLSearchParams(location.search).get("section");
 const route=Object.keys(views).find(key=>views[key].doctype===requested);
 if(route)showDoctype(route);
});
</script>
