{% extends "templates/web.html" %}
{% block title %}Technician Portal{% endblock %}
{% block page_content %}
<div id="cafm-technician-portal">
  <div class="tp-loading">Loading your technician workspace...</div>
</div>
<script>
frappe.ready(function () {
  const root = document.getElementById("cafm-technician-portal");
  if (!root) return;

  const state = {
    area: "work",
    workView: "active",
    requestView: "all",
    priority: "All",
    location: "All",
    workData: {},
    requestData: {},
    selectedWork: null,
    selectedRequest: null,
    requestForm: false,
    editingRequest: null,
    completing: false,
    collapsed: localStorage.getItem("cafm-technician-portal-collapsed") === "1",
    userName: "Technician",
  };

  const esc = value => String(value || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const call = (method, args) => new Promise((resolve, reject) => frappe.call({
    method, args: args || {},
    callback: response => resolve(response.message || {}),
    error: reject,
  }));
  const displayName = value => {
    const parts = String(value || "Technician").trim().split(/\s+/).filter(Boolean);
    return parts.length > 1 ? parts[0] + " " + parts[parts.length - 1] : parts[0] || "Technician";
  };
  const initials = value => displayName(value).split(/\s+/).slice(0, 2)
    .map(part => part.charAt(0).toUpperCase()).join("");
  const statusKey = value => String(value || "").toLowerCase().replace(/\s+/g, "_");

  function icon(name) {
    const paths = {
      brand: '<path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path d="m14.8 8.5-2.1 7h-2.3L8.8 11h2.1l.8 2.8.9-3.2a2.8 2.8 0 0 1 2.2-2.1Z"/>',
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
      assigned: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8m-8 4h5"/>',
      progress: '<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',
      pending: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      overdue: '<path d="M10.3 3.6 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/>',
      completed: '<circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.6L16.5 9"/>',
      requests: '<path d="M4 4h16v13H7l-3 3Z"/><path d="M8 8h8m-8 4h5"/>',
      new: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/>',
      resolved: '<path d="M20 11a8 8 0 1 1-4.7-7.3"/><path d="m9 11 3 3 8-8"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      refresh: '<path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 3v5h-5"/>',
      down: '<path d="m6 9 6 6 6-6"/>',
      about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
      logout: '<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/>',
      left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
      back: '<path d="m15 18-6-6 6-6"/><path d="M9 12h10"/>', plus: '<path d="M12 5v14M5 12h14"/>'
    };
    return '<svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || paths.home) + '</svg>';
  }

  function navButton(id, label, count, iconName) {
    const active = (state.area === "work" ? "work-" + state.workView : "request-" + state.requestView) === id;
    return '<button class="tp-nav-item' + (active ? ' active' : '') + '" data-section="' + id + '" title="' + esc(label) + '"><span class="tp-nav-icon">' + icon(iconName) + '</span><em>' + esc(label) + '</em></button>';
  }

  function sidebar() {
    const summary = state.workData.summary || {};
    const requestRows = state.requestData.requests || [];
    const requestCount = key => requestRows.filter(row => {
      const status = statusKey(row.custom_issue_status || "New");
      return key === "all" ? !["resolved", "closed", "rejected"].includes(status) : key === "resolved" ? ["resolved", "closed"].includes(status) : status === key;
    }).length;
    return '<aside class="tp-sidebar">'
      + '<div class="tp-brand"><span>' + icon("brand") + '</span><div><strong>CAFM</strong><small>TECHNICIAN PORTAL</small></div></div>'
      + '<div class="tp-account-wrap"><button class="tp-profile tp-account-button" type="button" aria-expanded="false"><span>' + esc(initials(state.userName)) + '</span><div><p>FACILITY TEAM</p><h2>' + esc(displayName(state.userName)) + '</h2></div><b>' + icon("down") + '</b></button>'
      + '<div class="tp-account-menu" hidden><button class="tp-account-about" type="button">' + icon("about") + '<span>About</span></button><button class="tp-account-logout" type="button">' + icon("logout") + '<span>Log out</span></button></div></div>'
      + '<div class="tp-nav-group"><small>MY WORK</small>'
      + navButton("work-active", "All tasks", (summary.assigned || 0) + (summary.in_progress || 0) + (summary.pending || 0), "home")
      + navButton("work-assigned", "Assigned", summary.assigned || 0, "assigned")
      + navButton("work-in_progress", "In Progress", summary.in_progress || 0, "progress")
      + navButton("work-pending", "Pending", summary.pending || 0, "pending")
      + navButton("work-overdue", "Overdue", summary.overdue || 0, "overdue")
      + navButton("work-completed", "Completed", undefined, "completed") + '</div>'
      + '<div class="tp-nav-group"><small>MY REQUESTS</small>'
      + navButton("request-all", "All requests", requestCount("all"), "requests")
      + navButton("request-new", "New", requestCount("new"), "new")
      + navButton("request-in_progress", "In Progress", requestCount("in_progress"), "progress")
      + navButton("request-resolved", "Resolved", requestCount("resolved"), "resolved") + '</div>'
      + '<button class="tp-create-request" type="button"><span>' + icon("plus") + '</span><em>Create request</em></button>'
      + '<p class="tp-note">Assigned work and requests submitted by your account only.</p>'
      + '<button class="tp-collapse" type="button"><span class="tp-collapse-icon">' + icon(state.collapsed ? "right" : "left") + '</span><em>' + (state.collapsed ? "Expand" : "Collapse") + '</em></button>'
      + '</aside>';
  }

  function workFilters() {
    const locations = state.workData.locations || [];
    const options = (values, current, allLabel) => '<option value="All">' + allLabel + '</option>' + values.map(value => '<option value="' + esc(value) + '"' + (value === current ? ' selected' : '') + '>' + esc(value) + '</option>').join("");
    return '<section class="tp-filters"><label>Task range<select data-work-filter="view">'
      + [["active", "All active tasks"], ["assigned", "Assigned"], ["in_progress", "In Progress"], ["pending", "Pending"], ["overdue", "Overdue"], ["completed", "Completed — last 30 days"]].map(item => '<option value="' + item[0] + '"' + (state.workView === item[0] ? ' selected' : '') + '>' + item[1] + '</option>').join("")
      + '</select></label><label>Priority<select data-work-filter="priority">' + options(["Critical", "High", "Medium", "Low"], state.priority, "All priorities") + '</select></label>'
      + '<label>Location<select data-work-filter="location">' + options(locations, state.location, "All locations") + '</select></label></section>';
  }

  function workContent() {
    const jobs = state.workData.work_orders || [];
    const titles = {active: ["ALL ACTIVE TASKS", "My active work"], assigned: ["ASSIGNED TASKS", "Ready to start"], in_progress: ["TASKS IN PROGRESS", "Work underway"], pending: ["PENDING TASKS", "Work on hold"], overdue: ["OVERDUE TASKS", "Needs attention"], completed: ["LAST 30 DAYS", "Completed work"]};
    const heading = titles[state.workView] || titles.active;
    const cards = jobs.length ? jobs.map(job => '<button class="tp-work-card" data-work-order="' + esc(job.name) + '"><div><span class="tp-badge priority-' + statusKey(job.priority) + '">' + esc(job.priority || "Not set") + '</span>' + (job.is_overdue ? '<span class="tp-badge danger">Overdue</span>' : '') + '</div><strong>' + esc(job.subject || job.name) + '</strong><span class="tp-status">' + esc(job.work_order_status) + '</span><p>' + esc(job.facility_location || "Location not set") + '<br>' + esc(job.asset || "No asset linked") + '</p><footer><span>SLA: ' + esc(job.sla_status || "Not applicable") + '</span><b>View ›</b></footer></button>').join("") : '<div class="tp-empty"><h3>No matching jobs</h3><p>Try another task range or filter.</p></div>';
    return header(heading[0], heading[1]) + workFilters() + '<div class="tp-result-count">' + jobs.length + ' jobs found</div><div class="tp-card-list">' + cards + '</div>' + workModal();
  }

  function requestFilters() {
    const data = state.requestData;
    const optionList = (values, current, label) => '<option value="All">All ' + label.toLowerCase() + '</option>' + (values || []).map(value => '<option value="' + esc(value) + '"' + (current === value ? ' selected' : '') + '>' + esc(value) + '</option>').join("");
    return '<section class="tp-filters tp-request-filters"><label>Priority<select data-request-filter="priority">' + optionList(data.priorities, state.priority, "priorities") + '</select></label><label>Location<select data-request-filter="location">' + optionList(data.locations, state.location, "locations") + '</select></label></section>';
  }

  function requestContent() {
    if (state.requestForm) return header("FACILITY REQUEST", state.editingRequest ? "Update your request" : "Tell the facility team what you need") + requestForm();
    const requests = (state.requestData.requests || []).filter(row => {
      const status = statusKey(row.custom_issue_status || "New");
      const matchesView = state.requestView === "all" ? !["resolved", "closed"].includes(status) : state.requestView === "resolved" ? ["resolved", "closed"].includes(status) : status === state.requestView;
      return matchesView && (state.priority === "All" || row.priority === state.priority) && (state.location === "All" || row.custom_facility_location === state.location);
    });
    const cards = requests.length ? requests.map(row => '<button class="tp-request-card" data-request="' + esc(row.name) + '"><div><span class="tp-status">' + esc(row.custom_issue_status || "New") + '</span><em>' + esc(row.priority) + '</em><strong>' + esc(row.subject) + '</strong><small>' + esc(row.custom_facility_location) + ' · ' + esc(row.issue_type) + '</small></div><b>View ›</b></button>').join("") : '<div class="tp-empty"><h3>No matching requests</h3><p>Create a request when you need help from the facility team.</p></div>';
    return header("MY REQUESTS", "Track your facility requests") + requestFilters() + '<div class="tp-result-count">' + requests.length + ' requests found</div><div class="tp-card-list">' + cards + '</div>' + requestModal();
  }

  function header(label, title) {
    return '<header class="tp-main-header"><div><p>' + esc(label) + '</p><h1>' + esc(title) + '</h1></div><button class="tp-notifications" type="button" title="Notifications">' + icon("bell") + '</button><button class="tp-refresh" type="button">' + icon("refresh") + '<span>Refresh</span></button></header>';
  }

  function requestForm() {
    const data = state.requestData, row = state.editingRequest || {};
    const options = (values, current, label) => '<option value="" disabled' + (!current ? ' selected' : '') + '>Select ' + label + '</option>' + (values || []).map(value => '<option value="' + esc(value) + '"' + (current === value ? ' selected' : '') + '>' + esc(value) + '</option>').join("");
    return '<section class="tp-form"><button class="tp-back" type="button">‹ Back to requests</button><form id="tp-request-form"><label>Subject<input name="subject" required value="' + esc(row.subject) + '" placeholder="Briefly describe the issue"></label><label>Facility location<select name="facility_location" required>' + options(data.locations, row.custom_facility_location, "location") + '</select></label><label>Category<select name="issue_type" required>' + options(data.categories, row.issue_type, "category") + '</select></label><label>Priority<select name="priority" required>' + options(data.priorities, row.priority, "priority") + '</select></label><label>Description<textarea name="description" required placeholder="Describe what happened and when it started.">' + esc(row.description) + '</textarea></label><button class="tp-primary" type="submit">' + (state.editingRequest ? "Save changes" : "Submit request") + '</button></form></section>';
  }

  function requestModal() {
    const row = state.selectedRequest;
    if (!row) return "";
    const canChange = row.custom_issue_status === "New" && !row.custom_work_order;
    return '<div class="tp-modal-backdrop"><section class="tp-modal"><button class="tp-modal-close" type="button">×</button><p>REQUEST ' + esc(row.name) + '</p><h2>' + esc(row.subject) + '</h2><div class="tp-detail-grid"><div><small>Status</small><strong>' + esc(row.custom_issue_status || "New") + '</strong></div><div><small>Priority</small><strong>' + esc(row.priority) + '</strong></div><div><small>Location</small><strong>' + esc(row.custom_facility_location) + '</strong></div><div><small>Category</small><strong>' + esc(row.issue_type) + '</strong></div></div><article><small>Description</small><p>' + esc(row.description).replace(/\n/g, "<br>") + '</p></article>' + (canChange ? '<footer><button class="tp-secondary tp-edit-request">Edit request</button><button class="tp-danger tp-withdraw-request">Withdraw request</button></footer>' : '<div class="tp-readonly">This request is already being handled and can no longer be changed here.</div>') + '</section></div>';
  }

  function workModal() {
    const row = state.selectedWork;
    if (!row) return "";
    const status = row.status || row.work_order_status;
    const checklist = (row.checklist || []).map(item => '<div class="tp-check-row"><span>' + esc(item.description) + (item.is_required ? ' *' : '') + '</span><select data-check-name="' + esc(item.name) + '" data-check-idx="' + esc(item.idx) + '">' + ["Pending", "Pass", "Fail", "N/A"].map(value => '<option' + (item.result === value ? ' selected' : '') + '>' + value + '</option>').join("") + '</select><input data-check-comment="' + esc(item.name) + '" value="' + esc(item.comments) + '" placeholder="Comments"></div>').join("");
    const actions = status === "Assigned" ? '<button class="tp-primary" data-work-status="In Progress">Start work</button>' : status === "In Progress" ? '<button class="tp-secondary tp-pend-work">Put on hold</button><button class="tp-primary tp-complete-work">Complete work</button>' : status === "Pending" ? '<button class="tp-primary" data-work-status="In Progress">Resume work</button>' : '';
    const completion = state.completing ? '<form id="tp-completion-form"><h3>Complete work</h3>' + (checklist ? '<div class="tp-checklist">' + checklist + '</div>' : '') + '<label>Resolution summary<textarea name="resolution_summary" required placeholder="Describe what was completed."></textarea></label><label>Technician notes<textarea name="technician_notes" placeholder="Add any follow-up notes.">' + esc(row.technician_notes) + '</textarea></label><div><button class="tp-secondary tp-cancel-completion" type="button">Cancel</button><button class="tp-primary" type="submit">Submit completion</button></div></form>' : '';
    return '<div class="tp-modal-backdrop"><section class="tp-modal tp-work-modal"><button class="tp-modal-close" type="button">×</button><p>WORK ORDER ' + esc(row.name) + '</p><h2>' + esc(row.subject || row.name) + '</h2><div class="tp-detail-grid"><div><small>Status</small><strong>' + esc(status) + '</strong></div><div><small>Priority</small><strong>' + esc(row.priority) + '</strong></div><div><small>Location</small><strong>' + esc(row.facility_location) + '</strong></div><div><small>Asset</small><strong>' + esc(row.asset || "Not linked") + '</strong></div></div><article><small>Work description</small><p>' + esc(row.work_description || "No description provided.").replace(/\n/g, "<br>") + '</p></article>' + completion + (!state.completing && actions ? '<footer>' + actions + '</footer>' : '') + '</section></div>';
  }

  function render() {
    root.innerHTML = '<div class="tp-shell' + (state.collapsed ? ' is-collapsed' : '') + '">' + sidebar() + '<main class="tp-main">' + (state.area === "work" ? workContent() : requestContent()) + '</main></div>';
    bind();
  }

  function bind() {
    root.querySelectorAll("[data-section]").forEach(button => button.onclick = () => {
      const parts = button.dataset.section.split("-");
      state.area = parts.shift();
      if (state.area === "work") state.workView = parts.join("-");
      else state.requestView = parts.join("-");
      state.selectedWork = null; state.selectedRequest = null; state.requestForm = false;
      loadCurrent();
    });
    const shell = root.querySelector(".tp-shell");
    const collapseButton = root.querySelector(".tp-collapse");
    const accountWrap = root.querySelector(".tp-account-wrap");
    const accountButton = root.querySelector(".tp-account-button");
    const accountMenu = root.querySelector(".tp-account-menu");
    let accountOpenedFromCollapsed = false;

    const setSidebarCollapsed = collapsed => {
      state.collapsed = collapsed;
      shell.classList.toggle("is-collapsed", collapsed);
      collapseButton.querySelector(".tp-collapse-icon").innerHTML = icon(collapsed ? "right" : "left");
      collapseButton.querySelector("em").textContent = collapsed ? "Expand" : "Collapse";
      collapseButton.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
      localStorage.setItem("cafm-technician-portal-collapsed", collapsed ? "1" : "0");
    };
    const openAccountMenu = () => {
      accountMenu.hidden = false;
      accountMenu.classList.add("is-opening");
      requestAnimationFrame(() => requestAnimationFrame(() => accountMenu.classList.remove("is-opening")));
    };
    const closeAccountMenu = () => {
      if (accountMenu.hidden) return;
      accountMenu.hidden = true;
      accountButton.setAttribute("aria-expanded", "false");
      if (accountOpenedFromCollapsed) {
        accountOpenedFromCollapsed = false;
        setSidebarCollapsed(true);
      }
    };

    accountButton.onclick = () => {
      if (shell.classList.contains("is-collapsed")) {
        accountOpenedFromCollapsed = true;
        setSidebarCollapsed(false);
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
        return;
      }
      if (accountMenu.hidden) {
        openAccountMenu();
        accountButton.setAttribute("aria-expanded", "true");
      } else closeAccountMenu();
    };
    root.onclick = event => { if (!accountWrap.contains(event.target)) closeAccountMenu(); };
    root.querySelector(".tp-account-about").onclick = () => {
      closeAccountMenu();
      frappe.msgprint({
        title: "Technician Portal",
        message: "Manage your assigned facility work and track requests submitted by your account.",
        indicator: "blue"
      });
    };
    root.querySelector(".tp-account-logout").onclick = () => frappe.call({
      method: "logout",
      callback: response => { if (!response.exc) window.location.assign("/login"); }
    });
    collapseButton.onclick = () => {
      accountOpenedFromCollapsed = false;
      closeAccountMenu();
      setSidebarCollapsed(!shell.classList.contains("is-collapsed"));
    };
    root.querySelector(".tp-create-request").onclick = async () => { state.area = "request"; state.requestForm = true; state.editingRequest = null; await loadRequests(); };
    root.querySelector(".tp-refresh").onclick = loadCurrent;
    root.querySelector(".tp-notifications").onclick = showNotifications;
    root.querySelectorAll("[data-work-filter]").forEach(control => control.onchange = () => { const key = control.dataset.workFilter; if (key === "view") state.workView = control.value; else state[key] = control.value; loadWork(); });
    root.querySelectorAll("[data-request-filter]").forEach(control => control.onchange = () => { state[control.dataset.requestFilter] = control.value; render(); });
    root.querySelectorAll("[data-work-order]").forEach(button => button.onclick = () => openWork(button.dataset.workOrder));
    root.querySelectorAll("[data-request]").forEach(button => button.onclick = () => { state.selectedRequest = (state.requestData.requests || []).find(row => row.name === button.dataset.request); render(); });
    const close = root.querySelector(".tp-modal-close"); if (close) close.onclick = () => { state.selectedWork = null; state.selectedRequest = null; state.completing = false; render(); };
    const back = root.querySelector(".tp-back"); if (back) back.onclick = () => { state.requestForm = false; state.editingRequest = null; render(); };
    const edit = root.querySelector(".tp-edit-request"); if (edit) edit.onclick = () => { state.editingRequest = state.selectedRequest; state.selectedRequest = null; state.requestForm = true; render(); };
    const withdraw = root.querySelector(".tp-withdraw-request"); if (withdraw) withdraw.onclick = withdrawRequest;
    const requestFormElement = root.querySelector("#tp-request-form"); if (requestFormElement) requestFormElement.onsubmit = submitRequest;
    root.querySelectorAll("[data-work-status]").forEach(button => button.onclick = () => changeWorkStatus(button.dataset.workStatus));
    const pending = root.querySelector(".tp-pend-work"); if (pending) pending.onclick = () => { const reason = window.prompt("Why is this work being put on hold?"); if (reason) changeWorkStatus("Pending", reason); };
    const complete = root.querySelector(".tp-complete-work"); if (complete) complete.onclick = () => { state.completing = true; render(); };
    const cancelCompletion = root.querySelector(".tp-cancel-completion"); if (cancelCompletion) cancelCompletion.onclick = () => { state.completing = false; render(); };
    const completionForm = root.querySelector("#tp-completion-form"); if (completionForm) completionForm.onsubmit = submitCompletion;
  }

  async function loadWork() {
    state.area = "work";
    const data = await call("cafm.mobile.get_my_work_orders", {view: state.workView, priority: state.priority, facility_location: state.location});
    state.workData = data;
    state.userName = data.user_full_name || state.userName;
    render();
  }
  async function loadRequests() { state.area = "request"; state.requestData = await call("cafm.portal.get_portal_requests"); render(); }
  function loadCurrent() { return state.area === "work" ? loadWork() : loadRequests(); }
  async function openWork(name) { state.selectedWork = await call("cafm.mobile.get_my_work_order", {work_order_name: name}); state.completing = false; render(); }
  async function changeWorkStatus(status, pendingReason) { await call("cafm.api.update_work_order_status", {work_order_name: state.selectedWork.name, status, pending_reason: pendingReason}); state.selectedWork = null; frappe.show_alert({message: "Work order updated", indicator: "green"}); await loadWork(); }
  async function submitCompletion(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const checklist = [...form.querySelectorAll("[data-check-name]")].map(control => ({name: control.dataset.checkName, idx: control.dataset.checkIdx, result: control.value, comments: form.querySelector('[data-check-comment="' + CSS.escape(control.dataset.checkName) + '"]').value}));
    await call("cafm.api.submit_technician_resolution", {work_order_name: state.selectedWork.name, resolution_summary: form.resolution_summary.value, technician_notes: form.technician_notes.value, checklist: JSON.stringify(checklist)});
    state.selectedWork = null; state.completing = false; frappe.show_alert({message: "Work completed", indicator: "green"}); await loadWork();
  }
  async function submitRequest(event) {
    event.preventDefault(); const form = event.currentTarget; const args = Object.fromEntries(new FormData(form).entries());
    const editing = state.editingRequest; if (editing) args.name = editing.name;
    const result = await call(editing ? "cafm.portal.update_portal_request" : "cafm.portal.submit_portal_request", args);
    frappe.show_alert({message: editing ? "Request updated" : "Request " + result.name + " submitted", indicator: "green"}); state.requestForm = false; state.editingRequest = null; state.requestView = "all"; await loadRequests();
  }
  function withdrawRequest() { frappe.confirm("Withdraw this request?", async () => { await call("cafm.portal.withdraw_portal_request", {name: state.selectedRequest.name}); state.selectedRequest = null; frappe.show_alert({message: "Request withdrawn", indicator: "green"}); await loadRequests(); }); }
  async function showNotifications() {
    const data = await call("cafm.mobile.get_my_mobile_notifications");
    const rows = (data.notifications || []).map(item => '<div class="tp-notification-row"><strong>' + esc(String(item.subject || "Notification").replace(/<[^>]*>/g, "")) + '</strong><small>' + esc(item.creation) + '</small></div>').join("") || '<p>No notifications yet.</p>';
    frappe.msgprint({title: "Notifications", message: rows});

.tp-nav-group{gap:2px;margin:1px 0 6px}.tp-nav-group>small{padding:5px 11px 2px;font-size:8px}.tp-nav-item{min-height:34px;padding:7px 11px}.tp-nav-item em{font-size:12px}.tp-create-request{min-height:38px;margin-top:6px}.tp-note{margin:9px 8px 6px;font-size:9px;line-height:1.4}.tp-collapse{min-height:36px;padding:7px 10px}
.tp-shell.is-collapsed{grid-template-columns:78px minmax(0,1fr)}.tp-shell.is-collapsed .tp-sidebar{width:78px;padding:18px 11px 14px}.tp-shell.is-collapsed .tp-brand{margin-bottom:20px}.tp-shell.is-collapsed .tp-account-wrap{margin:0 0 12px}.tp-shell.is-collapsed .tp-profile{margin:0;padding:8px}.tp-shell.is-collapsed .tp-account-button>b{display:none}.tp-shell.is-collapsed .tp-account-menu{top:0;left:56px;width:190px}
@media(max-width:760px){.tp-sidebar,.tp-shell.is-collapsed .tp-sidebar{width:100%;overflow:visible;padding:16px 14px}.tp-account-wrap,.tp-shell.is-collapsed .tp-account-wrap{margin:0 7px 12px}.tp-profile,.tp-shell.is-collapsed .tp-profile{margin:0;padding:9px 10px}.tp-shell.is-collapsed .tp-account-button>b{display:flex}.tp-account-menu,.tp-shell.is-collapsed .tp-account-menu{top:calc(100% + 7px);left:0;width:100%}}
</style>
{% endblock %}
